# The release-credential expiry clock, actually running ( §6).
#
# WHY THIS FILE EXISTS. §6 records four dated credentials and calls the K3
# certificate's date "a renewal date and not a fact to forget". Nothing read
# it: a `git grep` for either date across `tools/`, `test/` and `.github/`
# returned no hits at all. `tools/release/credential-expiry.mjs` turns that
# prose into a check, and this schedule is what makes it a mechanism rather
# than a tool nothing invokes - which is the exact two-step failure §9 already
# walked through with the Electron cadence.
#
# WHAT THIS JOB CAN AND CANNOT SEE. The credential material lives in the
# release machine's 0600 store (§6) and deliberately nowhere else, so a hosted
# runner holds none of it and every row here reports DECLARED-ONLY. That is
# the calendar half of the check and it is the half with a deadline. The
# measuring half - reading `notAfter` out of the artifact itself and failing on
# any drift from the declaration - runs in `credential-expiry.smoke.js` on the
# release machine at every push, where the certificates actually are.
#
# It is deliberately NOT a release gate. Once a credential enters its renewal
# lead time this goes red every week until someone renews, and a gate that
# blocks all releases for sixty days would be switched off long before the
# certificate expired. §6 asks for an owner who is told, and a weekly red job
# tells them.

name: Credential expiry

on:
  schedule:
    # Mondays, 09:10 UTC, ten minutes behind the Electron cadence so the two
    # clocks report in a predictable order rather than racing for attention.
    - cron: '10 9 * * 1'
  workflow_dispatch:

jobs:
  expiry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No `pnpm install`: the tool reads a JSON declaration and shells out to
      # openssl only for rows whose artifact it can reach, of which a hosted
      # runner has none. Installing would make a credential clock depend on the
      # dependency graph, which is the coupling §9's job header already refuses.
      - name: Check the release-credential expiry clock
        run: node tools/release/credential-expiry.mjs
