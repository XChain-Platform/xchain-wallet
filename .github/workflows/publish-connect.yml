name: Publish xchain-connect to npm

# Publishes @dankest-llc/xchain-connect through npm Trusted Publishing (GitHub
# OIDC), so a release needs no npm token, login or passkey. The npm package is
# linked to this repository and this exact workflow file name; renaming the
# file breaks the link until `npm trust github` is run again.
on:
  push:
    tags:
      - "connect-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm must be on PATH before setup-node, or its pnpm cache step cannot
      # find the store.
      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - name: Install an OIDC-capable npm CLI
        run: npm install --global "npm@^11.5.1"

      - name: Check the tag matches the package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const pkg = require('./packages/connect/package.json');
          const expected = process.env.RELEASE_TAG.replace(/^connect-v/, '');
          if (pkg.version !== expected) {
            throw new Error(`${pkg.name} is ${pkg.version}, but the tag asks for ${expected}`);
          }
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # prepack rebuilds dist/ as well; building first fails the job before
      # anything is sent to npm.
      - name: Build the package
        run: pnpm --dir packages/connect run build

      # npm publish applies only publishConfig's registry settings (access, tag),
      # not its main, module, types or exports. connect 1.0.0 went out with the
      # workspace entry ./src/runtime.js, which the tarball does not ship, so a
      # plain import of the package failed. Lift those fields onto the manifest
      # in this job's checkout only; the workspace keeps its source entry.
      - name: Point the manifest at the built entry points
        working-directory: packages/connect
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          for (const key of ['main', 'module', 'types', 'exports']) {
            if (pkg.publishConfig?.[key] === undefined) throw new Error(`publishConfig.${key} is missing`);
            pkg[key] = pkg.publishConfig[key];
          }
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 4)}\n`);
          NODE

      # Install the packed tarball into a scratch project and load it the way a
      # site does, so an entry point the tarball lacks fails here and not for users.
      - name: Import the packed tarball
        working-directory: packages/connect
        run: |
          probe="$RUNNER_TEMP/connect-probe"
          mkdir -p "$probe"
          npm pack --pack-destination "$probe"
          npm install --prefix "$probe" --no-audit --no-fund "$probe"/dankest-llc-xchain-connect-*.tgz
          cat > "$probe/probe.mjs" <<'JS'
          import { createClient, generateNonce, getProvider } from '@dankest-llc/xchain-connect';
          for (const [name, value] of Object.entries({ createClient, generateNonce, getProvider })) {
              if (typeof value !== 'function') throw new Error(`import of ${name} gave ${typeof value}`);
          }
          JS
          cat > "$probe/probe.cjs" <<'JS'
          const { createClient } = require('@dankest-llc/xchain-connect');
          if (typeof createClient !== 'function') throw new Error(`require of createClient gave ${typeof createClient}`);
          JS
          node "$probe/probe.mjs"
          node "$probe/probe.cjs"

      - name: Publish
        working-directory: packages/connect
        run: npm publish --access public
