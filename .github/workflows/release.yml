name: Release

#  S4. Builds every shipped shell's artifacts from a `v*` tag and
# leaves them as run artifacts. It does NOT publish, submit, or sign the
# release manifest.
#
# WHAT THIS WORKFLOW DELIBERATELY CANNOT DO, and why:
#
#   It never sees K1. The release manifest is GPG-signed by the
#   maintainer on the release machine (§4: "K1 is never provisioned to
#   any CI runner"). A CI runner that could sign the manifest would make
#   every path into this workflow a path to a signed release, and there
#   are more of those paths than anyone can hold in their head.
#
#   It never publishes. No upload to downloads.xchain.io, no store
#   submission. Humans push the final button in v1 (§7).
#
# So the output of a successful run is: artifacts, plus a run ID. The
# maintainer records that run ID, checks its head SHA equals the tag
# commit, downloads the artifacts from THAT run, and signs locally
# (§6 steps 2-4). "An artifact whose CI run of origin cannot be named
# does not get signed" (§5).
#
# THE THREAT THIS WORKFLOW'S CONFIGURATION IS ABOUT. The remotes are
# shared and a second coder pushes to them. A tag-triggered workflow
# holding code-signing secrets is a signed-malware factory: anyone who
# can push a `v*` tag can fire it, and the manual store-publish gate
# does not help, because the output is a properly signed, notarized
# malicious binary. The manual gate protects the STORE, not the USER
# who downloads directly.
#
# The protections that make this safe are NOT all in this file. They are
# repository settings, and they must exist before this workflow is ever
# run with real secrets. See https://docs.xchain.io/components/wallet/release/ci-setup.
# In short:
#
#   1. A release tag must carry a signature from the maintainer's
#      offline tag-signing key. `verify-tag` checks that before any job
#      that can read a signing secret starts. This is the control the
#      rest rests on, and the only one not held in repo settings.
#   2. Signing lanes run in the `release-signing` GitHub Environment,
#      whose deployment-branch policy admits only the release tag
#      pattern, so no branch or pull request can reach them.
#   3. Signing secrets are bound to that environment, never repo-level.
#   4. No workflow with access to signing secrets triggers on
#      `pull_request`. This one triggers only on `v*` tags.
#
# Two controls this comment used to claim are NOT in force and never
# will be (operator decision 2026-08-03): the environment has no per-run
# human approval step (that needs a plan tier this org does not have),
# and no repository rule restricts who may create a `v*` tag (such a rule
# cannot exempt one named person while a second account holds admin, so
# none was created rather than a partial one). Anyone with push access
# can create a tag; what they cannot do is make a signing job run on it.
#
# Decisions in force: D3 = Azure Trusted Signing (Windows),
# D4 = GitHub-hosted runners everywhere.

on:
  push:
    tags:
      - 'v*'

# Never cancel a release build in flight. The default cancel-in-progress
# from ci.yml is wrong here: a half-built release that looks merely
# "cancelled" is one someone will re-run and half-trust.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Gate every downstream job on the tag being what it claims to be.
  # Cheap, and it fails the run before any secret-bearing job starts.
  verify-tag:
    runs-on: ubuntu-latest
    # `actions: read` is what lets the step-1 gate below list workflow runs
    # for the tag commit. `contents: read` alone returns 404 there, which the
    # gate reports as a refusal rather than a pass.
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      lockfile-sha256: ${{ steps.lockfile.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # actions/checkout recreates the TRIGGERING tag as a lightweight ref
      # pointing straight at the commit, which discards the annotated tag
      # object and with it the signature. Every check below then fails as
      # `cannot verify a non-tag object of type commit` - not because the tag
      # is unsigned, but because the runner no longer has a tag to verify.
      # Re-fetch it by force so what gets verified is the object the
      # maintainer actually signed.
      #
      # Found by the first release this workflow ever ran (v0.334.0, cut
      # 2026-08-01). It could not have been found any earlier: the gate fails
      # closed and no v* tag existed, so this line is the first thing the
      # first tag bought.
      - name: Restore the annotated tag object (checkout flattens it)
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      #  §8, tag control. The remotes are shared with a second coder,
      # so "can push a tag" must not equal "can start the signing machinery".
      # The repository ruleset restricting `v*` creation is the first half
      # and lives in repo settings
      # (https://docs.xchain.io/components/wallet/release/ci-setup); this is the
      # half that lives in the repo, and it is the ONLY release control
      # independent of the maintainer's GitHub account. Under D6 (single
      # maintainer) the environment approval comes from the same account
      # that pushed the tag, so without this signature the account is a
      # single point of total compromise.
      #
      # Ships EMPTY and fails closed, the same posture as the pinned update
      # key in  S5: until the ceremony (stage A) puts a real key here,
      # no release can run at all. That is deliberate. A gate that defaults
      # to "allow" when unconfigured is not a gate.
      - name: Tag must be GPG-signed by the release maintainer
        run: |
          set -euo pipefail
          KEY="tools/release/tag-signing-key.asc"
          FPR_FILE="tools/release/tag-signing-fingerprint.txt"

          EXPECTED="$(tr -d ' \n' < "$FPR_FILE" || true)"

          # A real fingerprint or nothing. The placeholder reads UNPINNED,
          # and anything else malformed is treated the same way: refuse.
          if ! printf '%s' "$EXPECTED" | grep -qE '^[0-9A-Fa-f]{40}$'; then
            echo "::error::tag-signing key is not pinned yet"
            echo "  $FPR_FILE reads '${EXPECTED}', not a 40-hex fingerprint."
            echo "  Populate it and $KEY from the key ceremony before cutting"
            echo "  a release. Failing closed: an unverified tag must not reach"
            echo "  a signing lane."
            exit 1
          fi
          gpg --batch --import "$KEY"
          # Trust the pinned key ultimately so `verify-tag` does not fail on
          # the web-of-trust rather than on the signature itself.
          echo "${EXPECTED}:6:" | gpg --batch --import-ownertrust

          if ! git verify-tag --raw "${GITHUB_REF_NAME}" 2>verify.txt; then
            echo "::error::tag ${GITHUB_REF_NAME} is not signed by a key we trust"
            sed 's/^/  /' verify.txt
            exit 1
          fi

          # `git verify-tag` succeeding is not enough: it passes for ANY key
          # in the keyring. Bind it to the pinned fingerprint explicitly.
          if ! grep -q "VALIDSIG ${EXPECTED}" verify.txt; then
            echo "::error::tag ${GITHUB_REF_NAME} is signed, but not by the pinned key"
            echo "  expected fingerprint: ${EXPECTED}"
            sed 's/^/  /' verify.txt
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} verified against ${EXPECTED}"

      - name: Tag must match the committed version
        id: check
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag $TAG does not match package.json version $VERSION"
            echo "The tag must be pinned to the commit whose version it names;"
            echo "a mismatch means the tag was cut from the wrong SHA (§6 step 2)."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building ${VERSION} at $(git rev-parse HEAD)"

      #  §6 STEP 1, AS A GATE. .
      #
      # Everything above this line checks the TAG: who signed it, what
      # version it names. None of it checks whether anyone ever validated
      # the commit the tag points at, and that gap is not hypothetical.
      # v0.334.0 - the first release this project ever cut - was correctly
      # signed by K14, matched its package.json version, and pointed at a
      # commit whose CI run was CANCELLED with `build`, `test`, `audit` and
      # `drift-guards` all red. The release ran green.
      #
      # `cancelled` is the dangerous conclusion precisely because it reads
      # as "nothing went wrong": ci.yml's concurrency group cancels the
      # previous push's run, so any commit superseded before its suite
      # finished carries a cancelled run and was never actually tested.
      #
      # Placed here rather than in a job of its own so it runs BEFORE any
      # secret-bearing lane, in the same job as the other cheap refusals,
      # and costs one API call. `actions: read` is job-scoped rather than
      # granted at the top of the file: no other job needs it.
      - name: Tag commit must have a green CI run (§6 step 1)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/release/verify-validated-commit.mjs --sha "$(git rev-parse HEAD)"

      # §8: "whatever the runner resolves is what gets signed with K3/K6 and
      # shipped to the fleet", so the resolved dep tree is identified in the
      # run's own output. Every lane installs --frozen-lockfile, so this one
      # hash describes all of them.
      - name: Record the lockfile hash
        id: lockfile
        run: |
          set -euo pipefail
          SHA="$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)"
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"
          echo "pnpm-lock.yaml sha256=${SHA}"

  # The unsigned lanes. These are the artifacts K1's manifest launders
  # into trust (§5 "Artifact provenance"), which is exactly why the run
  # ID is recorded and checked at signing time: nothing here is signed
  # by the runner, so provenance is the only thing linking these bytes
  # to this tag.
  build-unsigned:
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm (corepack)
        run: corepack enable
      # Pinned to an exact patch, and to the SAME one the reproduce
      # container installs. Every lane in this file asked for major "22",
      # which actions/setup-node resolves to whatever 22.x is newest on
      # the day the lane runs - so two releases a month apart shipped
      # bytes built by different toolchains, and neither matched the
      # container a third party verifies with. The reproducible-builds doc
      # (https://docs.xchain.io/components/wallet/reproducible-builds)
      # rests on "the toolchain version is part of the output", which was
      # true and was precisely the problem.
      #
      # tools/release/toolchain.json is the source of truth for this
      # number; test/smoke/audits/reproducible-toolchain.smoke.js fails
      # the build if any lane here drifts from it or floats again.
      - name: Use Node.js (pinned, see tools/release/toolchain.json)
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # SOURCE_DATE_EPOCH pinned to the tag commit's author date, the
      # same input the reproduce containers use. Without it the bundles
      # embed build time and the §6 step 3 reproduce check can never
      # match.
      - name: Pin SOURCE_DATE_EPOCH to the tag commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%at)" >> "$GITHUB_ENV"

      # Heap, not flags: the FIRST release run (v0.334.0) died here with
      # `FATAL ERROR: Reached heap limit ... JavaScript heap out of memory`,
      # aborting at ~2.0 GB after 44s. Node sizes its default old-space from
      # the machine it starts on, so a developer box with far more RAM builds
      # this happily and a GitHub-hosted runner does not: the failure was
      # invisible until the workflow first ran, and it is not reproducible
      # locally on anything roomy.
      #
      # 6 GB on a 16 GB runner leaves ample headroom while giving the bundler
      # room for the whole graph. Raising the ceiling is the right fix rather
      # than trimming the build, because nothing here is leaking - it is one
      # large synchronous bundle of a wallet that carries every chain.
      - name: Build web + extension
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          pnpm -C packages/web build
          pnpm -C packages/extension build

      # The gate that keeps the fabricated-address dev SDK out of a
      # shipped bundle. It runs here as well as at signing time, so a
      # tainted build fails in CI rather than at the end of a release.
      - name: Dev-mock gate
        run: bash tools/build-reproduce/check-no-dev-mock.sh

      - name: Package web tarball
        run: |
          set -euo pipefail
          V="${{ needs.verify-tag.outputs.version }}"
          tar --sort=name --owner=0 --group=0 --numeric-owner \
              --mtime="@${SOURCE_DATE_EPOCH}" \
              -czf "xchain-wallet-web-${V}.tar.gz" -C packages/web/dist .
      - name: Package extension zip
        run: |
          set -euo pipefail
          V="${{ needs.verify-tag.outputs.version }}"
          (cd packages/extension/dist && zip -qrX "../../../xchain-wallet-extension-${V}.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-web-extension
          path: |
            xchain-wallet-web-*.tar.gz
            xchain-wallet-extension-*.zip
          if-no-files-found: error

  desktop-linux:
    needs: verify-tag
    runs-on: ubuntu-latest
    env:
      # Read into a job env var so step-level `if:` can test it. §7.5: ONE
      # stable non-guessable path, shared across releases, because each
      # release's rehearsal build has it baked in and the NEXT release's
      # rehearsal needs that build to find the new staging pointer. Rotating
      # it per release would orphan the chain.
      STAGING_FEED: ${{ secrets.XCHAIN_STAGING_FEED_URL }}
      # Presence of the Snapcraft store credential IS the "is the Snap
      # Store channel set up yet" switch ( §16), read at job level so
      # the steps below have one condition - the same shape as MAS_CSC_LINK
      # on the mac job. Generate: `snapcraft export-login - | base64 -w0`.
      SNAP_CSC_LINK: ${{ secrets.SNAP_CSC_LINK }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm (corepack)
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pin SOURCE_DATE_EPOCH to the tag commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%at)" >> "$GITHUB_ENV"
      - name: Build desktop (linux x64 + arm64)
        run: pnpm -C packages/desktop dist --linux --x64 --arm64
      # The Snap Store package (§16), the THIRD Linux channel and a
      # committed goal since 2026-08-03 . Same gap this workflow
      # closed for MAS and AppX: the target exists behind XCHAIN_BUILD_SNAP=1
      # and nothing would ever set it. Gated on the store credential, which
      # does not exist yet (ceremony: Snapcraft account + reserved name), so
      # this stays inert until the channel is real. The snap would build
      # WITHOUT the credential - unlike appx, no identity is baked in - but
      # snapcraft is not on the runner image and an artifact nothing can
      # upload would ride every release, so the credential is the switch.
      # BOTH ARCHES ARE WIRED TO CROSS-BUILD FROM THIS amd64 RUNNER, and the
      # store credential was never what gated verifying that .
      # resolveSnapCredentials() returns an empty map when SNAP_CSC_LINK is
      # unset and throws only on a credential that resolves EMPTY, so a local
      # `snapcraft pack` needs no store account. Only remote-build
      # authenticates. The blocker is a snapcraft HOST, nothing else.
      #
      # The target arch is NOT carried by a CLI flag. `--build-for` appears
      # only in generateRemoteBuildArgs() (the Launchpad path), and reading
      # that as "local builds are host-arch only" is wrong: core24.js emits a
      # `platforms: { <target>: { build-for: <target>, build-on: <host> } }`
      # block into the generated snapcraft.yaml whenever the target differs
      # from process.arch. So the line below DOES declare and attempt the
      # arm64 cross-build.
      #
      # What is unverified is whether that cross-build SUCCEEDS. The part
      # stages a prebuilt Electron tree rather than compiling, which is the
      # favourable case, but the stage-packages must resolve as arm64 debs on
      # this amd64 host, and that is what actually fails when snapcraft
      # cross-builds fail. Either outcome is loud: expected-artifacts.txt's
      # `optional *.snap default x64,arm64` passes a lane producing nothing
      # and REFUSES one producing a single arch, so a half-succeeding build
      # blocks the release rather than shipping an amd64-only set as
      # complete. Fallbacks, in order, are in  §16.
      #
      # Also unverified: nothing here sets useLXD/useMultipass/
      # useDestructiveMode, so electron-builder never passes `--use-lxd` and
      # the build relies on snapcraft's own default environment selection.
      # The `lxd init --auto` below prepares LXD; it does not select it.
      - name: Install snapcraft (Snap Store lane, §16)
        if: env.SNAP_CSC_LINK != ''
        run: |
          sudo snap install snapcraft --classic
          sudo lxd init --auto
      - name: Build the Snap Store package (opt-in, §16)
        if: env.SNAP_CSC_LINK != ''
        env:
          XCHAIN_BUILD_SNAP: '1'
        run: pnpm -C packages/desktop dist --linux --x64 --arm64
      - name: Dev-mock gate
        run: bash tools/build-reproduce/check-no-dev-mock.sh
      # Blockmaps are delta-update metadata and differential updates are a
      # non-goal (§7). builder-debug.yml is electron-builder's own dump; it
      # shares the extension with the channel pointers and must not be
      # mistaken for one, or shipped. Both dropped here so they never reach
      # the staging dir, where expected-artifacts.txt would refuse them.
      - name: Drop delta metadata and build byproducts
        run: rm -f packages/desktop/dist/*.blockmap packages/desktop/dist/builder-debug.yml
      # Expected URL + channel come from the builder config, not from a
      # literal here: this workflow must never name the feed (see the
      # no-publish guard in test/smoke/audits/release-ci.smoke.js).
      - name: Assert the packaged feed config ( §7.5)
        run: node tools/release/update-info.mjs assert-feed packages/desktop/dist
             --from-config packages/desktop/electron-builder.config.cjs
      # The `*.yml` line is the channel pointers (stable-linux.yml and
      # stable-linux-arm64.yml). Without it the lane uploads binaries that
      # nothing ever points at: the release publishes clean and no
      # installed wallet is ever offered it. Arch-suffixed names are why
      # this is a glob and why publish.sh regenerates the list from disk.
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.snap
            packages/desktop/dist/*.yml
          if-no-files-found: error

      # ---- §7.5 rehearsal variant -------------------------------------
      #
      # AppImage only: it is the one Linux format electron-updater can
      # actually swap in place, and a staging variant of a format with no
      # auto-update path exercises nothing. Builds to `dist-staging`
      # (selected by the config off XCHAIN_STAGING_FEED_URL) because
      # electron-builder names artifacts by VERSION, not channel: a staging
      # AppImage and a prod AppImage are byte-different twins under the same
      # filename, and sharing a directory would let one be signed and
      # published as the other.
      #
      # Uploaded under its own artifact name and NEVER into the release
      # staging directory, so it cannot reach RELEASE_HASHES or the feed.
      - name: Build the rehearsal variant (staging feed)
        if: env.STAGING_FEED != ''
        env:
          XCHAIN_STAGING_FEED_URL: ${{ secrets.XCHAIN_STAGING_FEED_URL }}
        run: pnpm -C packages/desktop dist --linux --x64 --arm64
      - name: Assert the rehearsal variant points at STAGING
        if: env.STAGING_FEED != ''
        env:
          XCHAIN_STAGING_FEED_URL: ${{ secrets.XCHAIN_STAGING_FEED_URL }}
        run: node tools/release/update-info.mjs assert-feed packages/desktop/dist-staging
             --from-config packages/desktop/electron-builder.config.cjs
      - uses: actions/upload-artifact@v4
        if: env.STAGING_FEED != ''
        with:
          name: desktop-linux-rehearsal
          path: |
            packages/desktop/dist-staging/*.AppImage
            packages/desktop/dist-staging/*.yml
          if-no-files-found: error

  # ---- Signing lanes -------------------------------------------------
  #
  # Everything below runs in the `release-signing` environment, whose
  # deployment-branch policy admits only the release tag pattern: a job
  # here cannot start, and therefore cannot touch a signing secret, from
  # a branch or a pull request. There is no human approval step on it (see
  # the header), so what stands between "can push a tag" and "can mint a
  # signed binary" is `verify-tag` refusing every tag that does not carry
  # the maintainer's offline signature. That is not a formality: it is
  # the whole of it.

  desktop-macos:
    needs: verify-tag
    runs-on: macos-latest
    environment: release-signing
    env:
      STAGING_FEED: ${{ secrets.XCHAIN_STAGING_FEED_URL }}
      # Presence of the Apple Distribution cert IS the "is the App Store
      # channel set up yet" switch, read at job level so the step below has
      # one condition (§13; same shape as the iOS lane's ASC_KEY_ID).
      MAS_CSC_LINK: ${{ secrets.MAS_CSC_LINK }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm (corepack)
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pin SOURCE_DATE_EPOCH to the tag commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%at)" >> "$GITHUB_ENV"
      - name: Build, sign and notarize (macOS x64 + arm64)
        env:
          # Developer ID Application cert (K3) + App Store Connect API
          # key (K4), consumed by electron-builder. Bound to this
          # environment, never repo-level.
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm -C packages/desktop dist --mac --x64 --arm64
      # The Mac App Store package (§13), the SECOND macOS channel and a
      # committed goal since 2026-08-01. Same gap as the Store lane on the
      # windows job: the target exists in the builder config behind
      # XCHAIN_BUILD_MAS=1 and nothing here set it, so a release could never
      # produce the `.pkg` the channel ships. Gated on the Apple Distribution
      # cert, which is a DIFFERENT certificate from the Developer ID one
      # above and does not exist yet, so this stays inert until it does.
      - name: Build the Mac App Store package (opt-in, §13)
        if: env.MAS_CSC_LINK != ''
        env:
          XCHAIN_BUILD_MAS: '1'
          CSC_LINK: ${{ secrets.MAS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAS_CSC_KEY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm -C packages/desktop dist --mac --x64 --arm64
      - name: Drop delta metadata and build byproducts
        run: rm -f packages/desktop/dist/*.blockmap packages/desktop/dist/builder-debug.yml
      # Expected URL + channel come from the builder config, not from a
      # literal here: this workflow must never name the feed (see the
      # no-publish guard in test/smoke/audits/release-ci.smoke.js).
      - name: Assert the packaged feed config ( §7.5)
        run: node tools/release/update-info.mjs assert-feed packages/desktop/dist
             --from-config packages/desktop/electron-builder.config.cjs
      # `*.yml` is the channel pointer: stable-mac.yml, one file covering
      # both arches. See the linux lane for why it is not optional.
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*mac*.zip
            packages/desktop/dist/*.yml
          if-no-files-found: error

      # ---- §7.5 rehearsal variant -------------------------------------
      #
      # zip only: on macOS electron-updater swaps the ZIP, never the dmg,
      # so a staging dmg would rehearse nothing. Signed and notarized with
      # the same identity as the real build, because the publisher-match
      # half of the update chain is exactly what the rehearsal is for.
      - name: Build the rehearsal variant (staging feed)
        if: env.STAGING_FEED != ''
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          XCHAIN_STAGING_FEED_URL: ${{ secrets.XCHAIN_STAGING_FEED_URL }}
        run: pnpm -C packages/desktop dist --mac --x64 --arm64
      - name: Assert the rehearsal variant points at STAGING
        if: env.STAGING_FEED != ''
        env:
          XCHAIN_STAGING_FEED_URL: ${{ secrets.XCHAIN_STAGING_FEED_URL }}
        run: node tools/release/update-info.mjs assert-feed packages/desktop/dist-staging
             --from-config packages/desktop/electron-builder.config.cjs
      - uses: actions/upload-artifact@v4
        if: env.STAGING_FEED != ''
        with:
          name: desktop-macos-rehearsal
          path: |
            packages/desktop/dist-staging/*mac*.zip
            packages/desktop/dist-staging/*.yml
          if-no-files-found: error

  desktop-windows:
    needs: verify-tag
    runs-on: windows-latest
    environment: release-signing
    env:
      STAGING_FEED: ${{ secrets.XCHAIN_STAGING_FEED_URL }}
      # Presence of the Partner Center identity IS the "is the Store channel
      # set up yet" switch, read at job level so the step below has one
      # condition rather than a per-step guess (§15; same shape as the iOS
      # lane's ASC_KEY_ID). Both are account-specific and neither exists yet.
      APPX_IDENTITY_NAME: ${{ secrets.APPX_IDENTITY_NAME }}
      APPX_PUBLISHER: ${{ secrets.APPX_PUBLISHER }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm (corepack)
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # This lane had no SOURCE_DATE_EPOCH pin while linux and macOS both
      # did, so Windows artifacts embedded the build time and could never
      # reproduce. Reproducibility is per-artifact: two green lanes and one
      # unpinned one is not "mostly reproducible", it is a Windows build
      # nobody can check.
      - name: Pin SOURCE_DATE_EPOCH to the tag commit
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%at)" >> "$GITHUB_ENV"
      # D3 = Azure Trusted Signing: cloud signing, no hardware token, so
      # this lane can run on a hosted runner at all. An EV cert on a
      # dongle could not.
      - name: Build and sign (Windows x64 + arm64)
        env:
          # AZURE_TENANT_ID / CLIENT_ID / CLIENT_SECRET are read by the
          # Azure SDK itself, not by electron-builder.config.cjs.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # The remaining three are config values. `endpoint` is REQUIRED by
          # the v26 azureSignOptions type and is region-specific, so it
          # cannot be defaulted; without it the config falls back to the
          # classic-cert path and the lane would produce UNSIGNED artifacts
          # while looking like it was configured for Azure.
          AZURE_CODE_SIGNING_ENDPOINT: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_NAME: ${{ secrets.AZURE_CODE_SIGNING_NAME }}
          AZURE_CERT_PROFILE_NAME: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
        run: pnpm -C packages/desktop dist --win --x64 --arm64
      # The Microsoft Store package (§15), the SECOND Windows channel and a
      # committed goal since 2026-08-01. The lane exists in the builder config
      # behind XCHAIN_BUILD_APPX=1, and nothing in this workflow set it, so a
      # release could never produce the artifact the channel ships. It runs
      # only when the Partner Center identity exists, on the same
      # presence-of-the-secret pattern the iOS lane uses: `AppxTarget` accepts
      # a missing `publisher` and emits a package that BUILDS and is then
      # rejected at ingestion for an identity mismatch, so a lane that ran
      # without these would produce exactly the artifact §15 warns about.
      - name: Build the Microsoft Store package (opt-in, §15)
        if: env.APPX_IDENTITY_NAME != '' && env.APPX_PUBLISHER != ''
        env:
          XCHAIN_BUILD_APPX: '1'
        run: pnpm -C packages/desktop dist --win --x64 --arm64
      - name: Drop delta metadata and build byproducts
        shell: bash
        run: rm -f packages/desktop/dist/*.blockmap packages/desktop/dist/builder-debug.yml
      # Expected URL + channel come from the builder config, not from a
      # literal here: this workflow must never name the feed (see the
      # no-publish guard in test/smoke/audits/release-ci.smoke.js).
      - name: Assert the packaged feed config ( §7.5)
        shell: bash
        run: node tools/release/update-info.mjs assert-feed packages/desktop/dist
             --from-config packages/desktop/electron-builder.config.cjs
      # `*.yml` is the channel pointer: stable.yml, with no OS suffix on
      # Windows and both arches in the one file. See the linux lane.
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*win*.zip
            packages/desktop/dist/*.yml
          if-no-files-found: error

      # ---- §7.5 rehearsal variant -------------------------------------
      #
      # nsis only: the zip has no auto-update path on Windows. Signed with
      # the same identity, since electron-updater's publisher-match check is
      # half of what the rehearsal exists to exercise.
      - name: Build the rehearsal variant (staging feed)
        if: env.STAGING_FEED != ''
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CODE_SIGNING_ENDPOINT: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_NAME: ${{ secrets.AZURE_CODE_SIGNING_NAME }}
          AZURE_CERT_PROFILE_NAME: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          XCHAIN_STAGING_FEED_URL: ${{ secrets.XCHAIN_STAGING_FEED_URL }}
        run: pnpm -C packages/desktop dist --win --x64 --arm64
      - name: Assert the rehearsal variant points at STAGING
        if: env.STAGING_FEED != ''
        shell: bash
        env:
          XCHAIN_STAGING_FEED_URL: ${{ secrets.XCHAIN_STAGING_FEED_URL }}
        run: node tools/release/update-info.mjs assert-feed packages/desktop/dist-staging
             --from-config packages/desktop/electron-builder.config.cjs
      - uses: actions/upload-artifact@v4
        if: env.STAGING_FEED != ''
        with:
          name: desktop-windows-rehearsal
          path: |
            packages/desktop/dist-staging/*.exe
            packages/desktop/dist-staging/*.yml
          if-no-files-found: error

  # ---- Mobile: iOS ( §5, stage S4b) ----------------------------
  #
  # Split in two on purpose, because the two halves are blocked by
  # different things:
  #
  #   Everything up to and including the SIMULATOR build needs no Apple
  #   account at all. It runs on every tag from the day this lands, so
  #   the iOS shell is proven to compile against the tag's own bundle
  #   instead of being discovered broken on submission day.
  #
  #   Everything from `archive` onward needs a signing identity (K5) that
  #   only exists once the K2 organization enrollment completes. Those
  #   steps are gated on the App Store Connect key being present, so
  #   while enrollment is pending this lane degrades to "built, not
  #   archived" rather than failing every release. The gate is
  #   `env.ASC_KEY_ID != ''`, the same shape the desktop lanes use for
  #   the staging feed.
  #
  # This lane does NOT upload. The ipa is a workflow artifact the release
  # machine collects; a human uploads it and a human presses submit
  # (rails no-auto-publish, §5). test/smoke/audits/release-ci.smoke.js
  # enforces that, and it is the reason no altool/fastlane step appears
  # below however convenient one would be.
  #
  # Signing is cloud-managed: `-allowProvisioningUpdates` authenticated by
  # the ASC API key, so K5 materializes on the runner transiently and is
  # never stored as a repo secret (§5).
  mobile-ios:
    needs: verify-tag
    runs-on: macos-latest
    environment: release-signing
    env:
      # Presence of the key IS the "is Apple set up yet" switch. One
      # secret, read in one place, so the lane has a single condition
      # rather than a per-step guess at what is provisioned.
      ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm (corepack)
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pin SOURCE_DATE_EPOCH to the tag commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%at)" >> "$GITHUB_ENV"
      # The store profile is not a preference here: a mobile store
      # artifact built at `default` carries the §2.3 review-hidden
      # surfaces, and expected-artifacts.txt declares the ipa as `store`,
      # so signing would reject it later anyway. Better to be wrong here,
      # loudly, than at the release machine.
      # Same ceiling as build-unsigned, and for the same bundle. This job has
      # never run (it postdates the last release), and macos-latest carries
      # 7 GB against ubuntu's 16, so the default old-space here is no larger.
      # A first run that OOMs would die before Xcode is ever reached, which is
      # exactly how mobile.yml spent three runs never reaching Gradle.
      - name: Build the web shell at the `store` profile
        env:
          XCHAIN_BUILD_PROFILE: store
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm --filter @xchain-wallet/web build
      - name: Dev-mock gate
        run: bash tools/build-reproduce/check-no-dev-mock.sh
      # sync:ios also writes ios/App/Version.xcconfig from the tag, which
      # is the ONLY place the Xcode project reads a version from (S4a).
      # Passing the tag here is what stops a runner from stamping the
      # package.json version onto a build tagged something else.
      - name: Stage the bundle into the iOS project
        env:
          XCHAIN_RELEASE_TAG: ${{ github.ref_name }}
        run: pnpm --filter @xchain-wallet/mobile sync:ios
      - name: Show the version the project will build
        run: cat packages/mobile/ios/App/Version.xcconfig
      # No signing identity required, so this runs whether or not Apple
      # is set up. It is the step that makes this lane worth landing now.
      - name: Build for the simulator (no signing identity required)
        run: xcodebuild
             -project packages/mobile/ios/App/App.xcodeproj
             -scheme App
             -configuration Release
             -destination 'generic/platform=iOS Simulator'
             CODE_SIGNING_ALLOWED=NO
             build
      # The ARCHIVE action, on every tag, with or without Apple ( row 22).
      #
      # The simulator build above and the signed archive below cover different
      # things, and the gap between them was where the archive script sat having
      # never executed anywhere: the simulator step does not run the script and
      # does not use the archive action at all, while the step below cannot run
      # until an Apple account exists. So the first run of a release script
      # would have been on submission day.
      #
      # Unsigned archiving needs no credential and exercises the script's
      # preflight, the scheme's archive action, the Release configuration, the
      # device destination and the Version.xcconfig wiring. It runs first so a
      # break in any of those is attributed here rather than to signing.
      - name: Archive unsigned (proves the lane, needs no Apple account)
        env:
          XCHAIN_IOS_ARCHIVE_UNSIGNED: '1'
        run: bash tools/release/ios-archive.sh
      - name: Archive for distribution
        if: env.ASC_KEY_ID != ''
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash tools/release/ios-archive.sh
      - name: Export the ipa
        if: env.ASC_KEY_ID != ''
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          XCHAIN_RELEASE_TAG: ${{ github.ref_name }}
        run: bash tools/release/ios-export.sh
      - uses: actions/upload-artifact@v4
        if: env.ASC_KEY_ID != ''
        with:
          name: mobile-ios
          path: packages/mobile/ios/build/xchain-wallet-ios-*.ipa
          if-no-files-found: error

  # Tells the maintainer, in the run's own output, exactly what §6 asks
  # them to record. A checklist nobody can find is one nobody follows.
  release-record:
    needs: [verify-tag, build-unsigned, desktop-linux, desktop-macos, desktop-windows]
    runs-on: ubuntu-latest
    steps:
      - name: What to record, and what happens next
        run: |
          {
            echo "## Release build complete: ${{ needs.verify-tag.outputs.version }}"
            echo
            echo "Record these in \`claude/reports/wallet-releases/${{ needs.verify-tag.outputs.version }}.md\`:"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Workflow run ID | \`${{ github.run_id }}\` |"
            echo "| Run head SHA | \`${{ github.sha }}\` |"
            echo "| Tag | \`${{ github.ref_name }}\` |"
            echo "| pnpm-lock.yaml sha256 | \`${{ needs.verify-tag.outputs.lockfile-sha256 }}\` |"
            echo
            echo "The lockfile hash is here because whatever the runners resolved"
            echo "is what got signed and shipped (§8). It is part of the record,"
            echo "not decoration."
            echo
            echo "### Next, on the release machine (not here)"
            echo
            echo "1. Confirm the head SHA above equals the tag commit."
            echo "2. Download the artifacts from THIS run id and no other."
            echo "3. Reproduce-check linux desktop + extension + web from a pristine tag clone."
            echo "4. Stage them and run \`pnpm release:sign\` - for the production set AND"
            echo "   the \`*-rehearsal\` set. K1 signs both, and lives only on that machine."
            echo "5. Rehearse the update (§7.5) against the STAGING feed using the"
            echo "   \`*-rehearsal\` artifacts from this run, and only then publish:"
            echo "   \`publish.sh --staging\`, then \`rehearse.mjs run\`, then"
            echo "   \`rehearse.mjs attest\` for each swap you watched."
            echo "   \`rehearse.mjs requirement\` says whether this release needs a swap"
            echo "   on one OS or on all of them. \`publish.sh\` refuses the production"
            echo "   upload without the resulting record, so this is a gate, not a step"
            echo "   to remember."
            echo
            echo "Nothing has been published. No store has been submitted."
          } >> "$GITHUB_STEP_SUMMARY"
