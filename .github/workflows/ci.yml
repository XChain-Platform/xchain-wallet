name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
concurrency:
  # On master, group per COMMIT. Elsewhere, group per ref.
  #
  # `cancel-in-progress: false` below is necessary but NOT sufficient, which was
  # measured the hard way: it protects a RUNNING job, and GitHub separately keeps
  # only one PENDING run per concurrency group, so a newer push still evicts a
  # queued one no matter what that flag says. Observed 2026-08-03 on the very
  # commit that introduced the flag: run on c4008051 was evicted while queued
  # (0 jobs ever started, concluded `cancelled`) by a later master push that
  # already carried the fix, while the in-progress run on bc58ff47 correctly
  # survived. Half the defect, half the fix.
  #
  # Per-commit grouping removes the contention rather than arbitrating it: two
  # master commits are never in the same group, so neither can evict the other
  # and every commit reaches a verdict the release gate can read. Pull requests
  # keep per-ref grouping, where superseding is the whole point.
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/master' && github.sha || 'ref' }}
  # Cancel superseded runs on pull requests and feature branches, where only the
  # latest push matters and runner minutes are the only cost. NEVER cancel on
  # master: the release gate (tools/release/verify-validated-commit.mjs) requires
  # a COMPLETED, SUCCESSFUL run on the exact tag commit, so a cancelled master run
  # leaves that commit permanently unreleasable. With several sessions pushing to
  # this repo, blanket cancellation made that the normal case rather than the
  # exception: measured 2026-08-03, 40 consecutive master runs produced 30
  # cancellations and exactly one success, so a green commit to tag was a matter
  # of luck. Cancellation was masking the record, not saving it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # Unit + security + smoke. `pnpm run ci` is the same gate bin/ci-all.sh and the
  # pre-push hook run, so local and CI cannot disagree about what "green" means.
  test:
    runs-on: ubuntu-latest
    env:
      # Hoisted so the checkout step below can gate on presence: the `secrets`
      # context is not usable in a step `if`, an `env` one is. Absent secret =
      # empty string = the step does not run and the docs-coupled smokes behave
      # exactly as they do today.
      XCHAIN_DOCS_READ_TOKEN: ${{ secrets.XCHAIN_DOCS_READ_TOKEN }}
      # Always set, deliberately. When the checkout ran, this is where the docs
      # are. When it did not, this names a path that does not exist, which is
      # what _docs-repo.js already reports honestly - and pointing it at a real
      # location only when a credential happens to exist would make the two
      # cases differ in more than one way at once.
      XCHAIN_DOCS_ROOT: ${{ github.workspace }}/.docs-sibling
    steps:
      - uses: actions/checkout@v4
      # The docs sibling, which `.ci-siblings` declares and this job did not
      # ship .
      #
      # WHY IT MATTERS MORE THAN "some smokes skip". Nineteen docs-coupled
      # smokes take their documented skip when ../xchain-documentation is
      # absent, and this job is the ONLY thing the release gate reads: 
      # §6 step 1 (tools/release/verify-validated-commit.mjs) certifies a tag's
      # commit on a green run of this workflow. So every release so far would
      # have been certified by a run in which the three store-ceremony gates,
      # the verify-release and reproducible-builds page gates, and the privacy
      # gates were never executed. That is 's "a gate that cannot find
      # its sibling is indistinguishable from a gate whose sibling is fine",
      # one layer up, at the gate that authorises signing.
      #
      # WHY IT IS CONDITIONAL RATHER THAN UNCONDITIONAL. xchain-documentation
      # is PRIVATE, and the repository-scoped GITHUB_TOKEN cannot read another
      # repository, so this needs its own credential. Gated on the secret being
      # present, exactly as release.yml gates the MAS and APPX steps: the step
      # is inert until an operator adds XCHAIN_DOCS_READ_TOKEN, and wiring it
      # ahead of the credential means the credential is the only remaining
      # step rather than the first of two.
      #
      # THE PATH IS NOT ARBITRARY. test/smoke/_docs-repo.js resolves the
      # sibling from its OWN location as <repo>/../xchain-documentation, never
      # from cwd, so the checkout has to land beside the workspace and not
      # inside it. Anything inside would also be swept into the repo's own
      # working tree, which the drift guards would then report as dirt.
      # TWO MECHANICS HERE ARE NOT PREFERENCES, they are what the platforms
      # allow, and both were established by reading rather than guessed:
      #
      #   - The gate is `if: env.X != ''` off a JOB-LEVEL env, not
      #     `if: secrets.X != ''`. That is the idiom release.yml already uses
      #     for MAS_CSC_LINK and APPX_IDENTITY_NAME; matching it keeps one
      #     pattern for "this step is inert until a credential exists".
      #   - `path:` is INSIDE the workspace. actions/checkout refuses a path
      #     outside GITHUB_WORKSPACE, so the sibling cannot be placed where a
      #     developer checkout puts it. XCHAIN_DOCS_ROOT exists for exactly
      #     this and _docs-repo.js honours it ahead of its relative default.
      - name: Check out the xchain-documentation sibling
        if: env.XCHAIN_DOCS_READ_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: XChain-Platform/xchain-documentation
          token: ${{ env.XCHAIN_DOCS_READ_TOKEN }}
          ref: master
          path: .docs-sibling
      # pnpm must be on PATH BEFORE setup-node, or its `cache: pnpm` step can't
      # resolve the pnpm store and fails with "Unable to locate executable file: pnpm".
      - name: Enable pnpm (corepack)
        run: corepack enable
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run test gate
        run: pnpm run ci

  # Cross-repo derivation-parity drift guard. The wallet's HD descriptors pin
  # their wifVersionByte / ADDRESS_PARAMS / coin-type slot against xchain-sdk,
  # and the parity suite skips by default (see the XCHAIN_REQUIRE_SIBLINGS gate
  # in test/integration/hd/wallet-sdk-derivation-parity.test.js) so an ordinary
  # run cannot go quietly green on a guard that did not execute. This job runs
  # it for real with XCHAIN_REQUIRE_SIBLINGS=1, so a descriptor<->SDK drift
  # fails CI.
  #
  # It no longer recreates a sibling layout. Since  DD6 the SDK is the
  # published @dankest-llc/xchain-sdk, which `pnpm install --frozen-lockfile`
  # brings in at the version a release would sign, so the guard compares the
  # wallet against the SDK it actually ships.
  drift-guards:
    runs-on: ubuntu-latest
    steps:
      # No sibling checkout: since  DD6 the shells consume the PUBLISHED
      # @dankest-llc/xchain-sdk, so `pnpm install --frozen-lockfile` below
      # installs the exact SDK a release would ship and the parity guard reads
      # that. The step this replaces checked out the private sibling repo with
      # `secrets.XCHAIN_SDK_DEPLOY_KEY`, a secret that has never existed on this
      # repo, so it failed `Not Found` on every push and took the whole job red.
      #
      # AND THE SUBDIRECTORY WENT WITH IT . This job used to check out
      # into `path: xchain-wallet` so a sibling could sit beside it. With the
      # sibling gone the subdirectory bought nothing and cost the job: with no
      # pnpm project at the runner's root, setup-node's pnpm cache had no store
      # path to save and its POST step failed, so `drift-guards` stayed red on
      # every push while the guard inside it passed. Measured on run
      # 30786270270: every step `success`, `Post Use Node.js 22` `failure`,
      # "Path(s) specified in the action for caching do(es) not exist". The
      # repo is checked out at the root here like every other job now.
      - uses: actions/checkout@v4
      - name: Enable pnpm (corepack)
        run: corepack enable
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Wallet<->SDK derivation-parity guard
        env:
          XCHAIN_REQUIRE_SIBLINGS: "1"
        run: pnpm exec vitest run --config test/vitest/integration.config.js test/integration/hd/wallet-sdk-derivation-parity.test.js

  # Build the shipped shells, then run the gates that can ONLY be checked against a
  # real build artifact. None of this can live in the `test` job: it has no dist/.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm (corepack)
        run: corepack enable
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # `-r` sweeps every package, so this builds the web SPA: one large
      # synchronous graph carrying every chain. Node sizes its default
      # old-space from the machine it starts on, so a dev box builds it and a
      # hosted runner aborts at ~2.0 GB. release.yml and mobile.yml each hit
      # this wall and were fixed one at a time; this job then hit it too and
      # took the three gates below down with it, none of which had run since.
      - name: Build all packages
        run: pnpm -r --if-present build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      # A shipped bundle must not be able to reach the dev-mock SDK: it serves
      # fabricated addresses and balances that a user cannot tell from real ones.
      # The sdkFactories refuse it under import.meta.env.PROD, so Vite eliminates
      # that branch from the artifact and this grep is real evidence.
      - name: No dev-mock SDK in the shipped bundles
        run: bash tools/build-reproduce/check-no-dev-mock.sh
      # `@trezor/connect-web` is T-RSL-licensed and forbids redistribution. It was
      # unbundled in c541ac7 (Trezor Connect now loads from connect.trezor.io); this
      # gate proves no @trezor/* code re-entered any shipped shell's dist bundle.
      - name: No bundled @trezor code in the shipped bundles
        run: bash tools/build-reproduce/check-no-trezor-dist.sh
      # Every integrity hash in the built index.html must match the bytes of the
      # asset it points at. A mismatch does not weaken SRI, it bricks the page: the
      # browser refuses to execute the bundle.
      - name: Subresource Integrity hashes match the built assets
        run: node test/smoke/security/web-sri.smoke.js

  # Coverage ratchet (G166). Separate from `test` so the pre-push gate stays
  # fast: instrumenting the run costs real time and nobody should pay it twice.
  # The thresholds live in test/vitest/unit.config.js and sit just under today's
  # numbers, so this job goes red on a REGRESSION, not on an aspiration.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm (corepack)
        run: corepack enable
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit coverage vs thresholds
        run: pnpm test:unit:coverage

  # Browser-driven E2E against the web shell (Playwright).
  #
  # This job is the whole point of the suite. It previously existed but nothing
  # ran it, and it died quietly: onboarding grew three screens (license gate,
  # recovery-phrase verification, ADS consent) and every one of the 15 specs
  # broke at the first click. A test suite nobody runs is not a safety net, it
  # is a claim of one. It cannot live in `pnpm run ci` -- it needs a browser and
  # a dev server, which the unit gate must not depend on -- so it gets its own
  # job here, and now every push proves it.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm (corepack)
        run: corepack enable
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Browser binaries are not in the pnpm store; fetch them explicitly.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      # The config spawns the Vite dev server itself (webServer), so there is
      # nothing to start here. CI=1 makes it refuse to reuse a stray server.
      - name: Run E2E suite
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test/e2e/playwright-report/
          retention-days: 7

  # Vulnerabilities in code that actually SHIPS. Deliberately --prod: the dev
  # toolchain's advisories (vitest's UI server, vite's dev-server path handling)
  # never reach a user, and blocking every push on them trains people to ignore the
  # gate. Production deps currently carry no high/critical advisory.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm (corepack)
        run: corepack enable
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
