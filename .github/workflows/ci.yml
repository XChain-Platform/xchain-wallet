name: CI
# Least privilege for the default GITHUB_TOKEN: every job here only reads the repo.
permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    # develop is where all work lands; master only ever receives release PRs.
    # Both run the gate: develop so a lane push is verified as it lands, master
    # so the merge commit a release tag points at has its own green run.
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
concurrency:
  # On a PROTECTED branch (master, develop), group per RUN. Elsewhere, group
  # per ref.
  #
  # `cancel-in-progress: false` below is necessary but NOT sufficient, which was
  # measured the hard way: it protects a RUNNING job, and GitHub separately keeps
  # only one PENDING run per concurrency group, so a newer push still evicts a
  # queued one no matter what that flag says. Observed 2026-08-03 on the very
  # commit that introduced the flag: run on c4008051 was evicted while queued
  # (0 jobs ever started, concluded `cancelled`) by a later master push that
  # already carried the fix, while the in-progress run on bc58ff47 correctly
  # survived. Half the defect, half the fix.
  #
  # Per-run grouping removes the contention rather than arbitrating it: two
  # master runs are never in the same group, so neither can evict the other
  # and every run reaches a verdict the release gate can read. Pull requests
  # keep per-ref grouping, where superseding is the whole point.
  #
  # develop joins master here rather than inheriting the feature-branch shape.
  # Under the develop/master model develop is where every agent lane and every
  # human commit lands, so it inherits exactly the contention that produced the
  # measurement below, and it is the branch a release is frozen FROM: the
  # ceremony requires green CI on the specific develop SHA a release branch is
  # cut at, which a run evicted while queued can never provide.
  group: ci-${{ github.ref }}-${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop') && github.sha || 'ref' }}-${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop') && github.run_id || 'latest' }}
  # Cancel superseded runs on pull requests and feature branches, where only the
  # latest push matters and runner minutes are the only cost. NEVER cancel on a
  # protected branch: the release gate (tools/release/verify-validated-commit.mjs)
  # requires a COMPLETED, SUCCESSFUL run on the exact tag commit, so a cancelled
  # run leaves that commit permanently unreleasable. With several sessions pushing
  # to this repo, blanket cancellation made that the normal case rather than the
  # exception: measured 2026-08-03, 40 consecutive master runs produced 30
  # cancellations and exactly one success, so a green commit to tag was a matter
  # of luck. Cancellation was masking the record, not saving it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/develop' }}

jobs:
  # Unit + security + smoke. `pnpm run ci` is the same gate bin/ci-all.sh and the
  # pre-push hook run, so local and CI cannot disagree about what "green" means.
  #
  # SHARDED FOR WALL TIME. The unit tier is about 30 of the gate's 36 minutes
  # (50 of 51 on 2026-11-18), so it runs as vitest `--shard` legs beside one leg that runs every other
  # step of `pnpm run ci`. That leg derives its command list from the `ci`
  # script itself rather than restating it, so a tier added to `ci` lands here
  # without a workflow edit, and a `ci` script that stops running
  # `pnpm test:unit` fails the leg instead of leaving the unit tier unsharded
  # and unrun. The required check `test` is the aggregator job below.
  test-shard:
    name: test ${{ matrix.leg }}
    runs-on: ubuntu-24.04
    strategy:
      # Every leg runs to its own verdict: a cancelled sibling reads as
      # infrastructure to the verdict job, which would hide the real failure.
      fail-fast: false
      matrix:
        include:
          - leg: unit shard 1/4
            unit_shard: 1/4
          - leg: unit shard 2/4
            unit_shard: 2/4
          - leg: unit shard 3/4
            unit_shard: 3/4
          - leg: unit shard 4/4
            unit_shard: 4/4
          - leg: rest of the gate
            unit_shard: ''
    env:
      # Where the docs checkout below lands. _docs-repo.js honours this ahead of
      # its relative default, which it has to: actions/checkout refuses a path
      # outside the workspace, so the sibling cannot sit beside the repo the way
      # a developer checkout puts it.
      XCHAIN_DOCS_ROOT: ${{ github.workspace }}/.docs-sibling
      XCHAIN_DOCS_BRANCH_ROOT: ${{ github.workspace }}/.docs-sibling/action-manifest-ref
      XCHAIN_ACTION_MANIFEST_ROOT: ${{ github.workspace }}/.docs-sibling/action-manifest-ref
    steps:
      - uses: actions/checkout@v4
      # The docs sibling, which `.ci-siblings` declares and this job did not
      # ship.
      #
      # WHY IT MATTERS MORE THAN "some smokes skip". Nineteen docs-coupled
      # smokes take their documented skip when ../xchain-documentation is
      # absent, and this job is the ONLY thing the release gate reads:
      # §6 step 1 (tools/release/verify-validated-commit.mjs) certifies a tag's
      # commit on a green run of this workflow. So every release so far would
      # have been certified by a run in which the three store-ceremony gates,
      # the verify-release and reproducible-builds page gates, and the privacy
      # gates were never executed. That is the same defect shape as "a gate that cannot find
      # its sibling is indistinguishable from a gate whose sibling is fine",
      # one layer up, at the gate that authorises signing.
      #
      # WHY IT IS UNCONDITIONAL. It used to be gated on an XCHAIN_DOCS_READ_KEY
      # deploy-key secret, because xchain-documentation was private and the
      # repository-scoped GITHUB_TOKEN cannot read another repository. That repo
      # is public now, so an anonymous checkout resolves it and the credential is
      # no longer needed - including on a fork, which was the other reason the
      # gate existed.
      #
      # The gate had to go rather than stay harmlessly: no such secret exists on
      # this repo, so the step never ran, XCHAIN_DOCS_ROOT named a path with
      # nothing at it, and 29 smokes failed with "the wallet docs sibling is
      # DECLARED in .ci-siblings but unreachable". A conditional whose condition
      # is never met is indistinguishable from a missing checkout, which is the
      # failure this whole block exists to prevent one layer up.
      #
      # THE PATH IS NOT ARBITRARY. test/smoke/_docs-repo.js resolves the
      # sibling from its OWN location as <repo>/../xchain-documentation, never
      # from cwd, so the checkout has to land beside the workspace and not
      # inside it. Anything inside would also be swept into the repo's own
      # working tree, which the drift guards would then report as dirt.
      # TWO MECHANICS HERE ARE NOT PREFERENCES, they are what the platforms
      # allow, and both were established by reading rather than guessed:
      #
      #   - `path:` is INSIDE the workspace. actions/checkout refuses a path
      #     outside GITHUB_WORKSPACE, so the sibling cannot be placed where a
      #     developer checkout puts it. XCHAIN_DOCS_ROOT exists for exactly
      #     this and _docs-repo.js honours it ahead of its relative default.
      - name: Check out the xchain-documentation sibling
        uses: actions/checkout@v4
        with:
          repository: XChain-Platform/xchain-documentation
          # DELIBERATELY master. xchain-documentation now has a develop branch
          # (levelled 2026-08-15) and its own CI runs on both, but what these
          # smokes assert is the PUBLISHED documentation a user reads, which is
          # master. Tracking develop here would gate a wallet release on docs
          # wording that has not shipped yet.
          ref: master
          path: .docs-sibling
      - name: Check out the canonical action manifest
        uses: actions/checkout@v4
        with:
          repository: XChain-Platform/xchain-documentation
          ref: ${{ github.base_ref || (github.ref == 'refs/heads/master' && 'master' || 'develop') }}
          path: .docs-sibling/action-manifest-ref
      # pnpm must be on PATH BEFORE setup-node, or its `cache: pnpm` step can't
      # resolve the pnpm store and fails with "Unable to locate executable file: pnpm".
      - name: Enable pnpm (corepack)
        run: corepack enable
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit tier shard
        if: matrix.unit_shard != ''
        run: pnpm test:unit --shard=${{ matrix.unit_shard }}
      - name: Run test gate without its unit tier
        if: matrix.unit_shard == ''
        run: |
          rest="$(node -e '
            const steps = require("./package.json").scripts.ci.split("&&").map((s) => s.trim());
            if (!steps.includes("pnpm test:unit")) {
              console.error("package.json scripts.ci no longer runs `pnpm test:unit`; update the test-shard legs in ci.yml");
              process.exit(1);
            }
            process.stdout.write(steps.filter((s) => s !== "pnpm test:unit").join(" && "));
          ')"
          echo "Running: $rest"
          bash -ec "$rest"

  # The required check named `test`. It runs whatever the legs did, because a
  # job skipped behind a failed need reports as passing to branch protection,
  # and fails unless every leg succeeded. It states no finding of its own, so
  # the verdict job leaves it out and names the failing leg instead.
  test:
    runs-on: ubuntu-24.04
    needs: [test-shard]
    if: ${{ always() }}
    steps:
      - name: Every test leg passed
        env:
          LEGS: ${{ needs.test-shard.result }}
        run: |
          echo "test legs concluded: $LEGS"
          [ "$LEGS" = success ] || { echo "::error::a test leg concluded $LEGS; the leg jobs name the failing step"; exit 1; }

  # Cross-repo derivation-parity drift guard. The wallet's HD descriptors pin
  # their wifVersionByte / ADDRESS_PARAMS / coin-type slot against xchain-sdk,
  # and the parity suite skips by default (see the XCHAIN_REQUIRE_SIBLINGS gate
  # in test/integration/hd/wallet-sdk-derivation-parity.test.js) so an ordinary
  # run cannot go quietly green on a guard that did not execute. This job runs
  # it for real with XCHAIN_REQUIRE_SIBLINGS=1, so a descriptor<->SDK drift
  # fails CI.
  #
  # It no longer recreates a sibling layout. Since DD6 the SDK is the
  # published @dankest-llc/xchain-sdk, which `pnpm install --frozen-lockfile`
  # brings in at the version a release would sign, so the guard compares the
  # wallet against the SDK it actually ships.
  drift-guards:
    runs-on: ubuntu-24.04
    steps:
      # No sibling checkout: since DD6 the shells consume the PUBLISHED
      # @dankest-llc/xchain-sdk, so `pnpm install --frozen-lockfile` below
      # installs the exact SDK a release would ship and the parity guard reads
      # that. The step this replaces checked out the private sibling repo with
      # `secrets.XCHAIN_SDK_DEPLOY_KEY`, a secret that has never existed on this
      # repo, so it failed `Not Found` on every push and took the whole job red.
      #
      # AND THE SUBDIRECTORY WENT WITH IT. This job used to check out
      # into `path: xchain-wallet` so a sibling could sit beside it. With the
      # sibling gone the subdirectory bought nothing and cost the job: with no
      # pnpm project at the runner's root, setup-node's pnpm cache had no store
      # path to save and its POST step failed, so `drift-guards` stayed red on
      # every push while the guard inside it passed. Measured on run
      # 30786270270: every step `success`, `Post Use Node.js 22` `failure`,
      # "Path(s) specified in the action for caching do(es) not exist". The
      # repo is checked out at the root here like every other job now.
      - uses: actions/checkout@v4
      - name: Enable pnpm (corepack)
        run: corepack enable
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Wallet<->SDK derivation-parity guard
        env:
          XCHAIN_REQUIRE_SIBLINGS: "1"
        run: pnpm exec vitest run --config test/vitest/integration.config.js test/integration/hd/wallet-sdk-derivation-parity.test.js
      # Wallet<->SDK pre-flight schema/code parity guard, the second escape of
      # the same shape. PreflightPanel hand-copies the Tier-1 finding codes and
      # the report schema version out of the SDK, and
      # xchain-sdk/src/preflight/constants.js names the test below as THE
      # enforcement point of its additive-only promise. That test also skips by
      # default when the SDK will not resolve, and it runs in the `test` job,
      # which sets nothing: so until this step existed, the enforcement point
      # the SDK names could only pass or vanish, never fail, in either lane that
      # certifies a release. The file runs twice by design, non-strict there and
      # strict here, exactly as the chain-registry guard below does.
      - name: Wallet<->SDK preflight schema/code parity guard
        env:
          XCHAIN_REQUIRE_SIBLINGS: "1"
        run: pnpm exec vitest run --config test/vitest/unit.config.js test/unit/components/PreflightPanel.tier1Notice.test.jsx
      # Wallet<->hub chain-registry guard. No hub checkout here, and
      # that is the point: --check compares tools/chain-registry.sync.json against
      # the bundled descriptors, so a descriptor fix that was never mirrored into
      # xchain-hub/src/chain-registry.json fails on THIS repo's push. Before this,
      # the only comparison lived in a hub test that skips without the wallet
      # sibling, and a corrected encoder port sat superseded on origin for both
      # repos with every gate green. test/unit/chainRegistrySync.test.js holds the
      # same assertion inside the `test` job; this step names it in the output.
      - name: Wallet<->hub chain-registry snapshot guard
        run: node tools/sync-chain-registry.mjs --check
      # Assert the frozen install put the lockfile-pinned published SDK in every
      # shell; a mismatch or a missing SDK fails the job.
      - name: Installed SDK matches lockfile pin
        run: pnpm run sdk:check

  # Build the shipped shells, then run the gates that can ONLY be checked against a
  # real build artifact. None of this can live in the `test` job: it has no dist/.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm (corepack)
        run: corepack enable
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # `-r` sweeps every package, so this builds the web SPA: one large
      # synchronous graph carrying every chain. Node sizes its default
      # old-space from the machine it starts on, so a dev box builds it and a
      # hosted runner aborts at ~2.0 GB. release.yml and mobile.yml each hit
      # this wall and were fixed one at a time; this job then hit it too and
      # took the four gates below down with it, none of which had run since.
      - name: Build all packages
        run: pnpm -r --if-present build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Desktop renderer boots and reaches wired Settings
        run: xvfb-run --auto-servernum env XCHAIN_REQUIRE_DESKTOP_RENDER=1 node test/smoke/shells/desktop-renders.smoke.js
      # A shipped bundle must not be able to reach the dev-mock SDK: it serves
      # fabricated addresses and balances that a user cannot tell from real ones.
      # The sdkFactories refuse it under import.meta.env.PROD, so Vite eliminates
      # that branch from the artifact and this grep is real evidence.
      - name: No dev-mock SDK in the shipped bundles
        run: bash tools/build-reproduce/check-no-dev-mock.sh
      # `@trezor/connect-web` is T-RSL-licensed and forbids redistribution. It was
      # unbundled in c541ac7 (Trezor Connect now loads from connect.trezor.io); this
      # gate proves no @trezor/* code re-entered any shipped shell's dist bundle.
      - name: No bundled @trezor code in the shipped bundles
        run: bash tools/build-reproduce/check-no-trezor-dist.sh
      # Every integrity hash in the built index.html must match the bytes of the
      # asset it points at. A mismatch does not weaken SRI, it bricks the page: the
      # browser refuses to execute the bundle.
      - name: Subresource Integrity hashes match the built assets
        run: node test/smoke/security/web-sri.smoke.js

  # Coverage ratchet (G166). Separate from `test` so the pre-push gate stays
  # fast: instrumenting the run costs real time and nobody should pay it twice.
  # The thresholds live in test/vitest/unit.config.js and sit just under today's
  # numbers, so this job goes red on a REGRESSION, not on an aspiration.
  #
  # SHARDED FOR WALL TIME. The instrumented run took 26 minutes on one runner
  # (48 on 2026-11-18), so it runs as vitest `--shard` legs that each write a blob report carrying
  # their raw coverage, and `coverage-merge` merges the blobs and checks the
  # thresholds once over the whole suite. The legs turn thresholds off: a quarter
  # of the suite cannot reach a floor set for all of it.
  #
  # Measured 2026-11-18 on the full suite (3215 files), unsharded against four
  # merged shards: covered counts equal, totals within 0.05 points on every
  # metric. The merge counts the few source files no unit test imports at their
  # real size where the unsharded run counts them 0/0, so it reads a hair lower,
  # never higher.
  coverage-shard:
    name: coverage shard ${{ matrix.shard }}/${{ matrix.total }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total: [4]
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm (corepack)
        run: corepack enable
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit coverage shard
        run: >-
          pnpm test:unit:coverage --shard=${{ matrix.shard }}/${{ matrix.total }}
          --reporter=default --reporter=blob
          --outputFile.blob=.vitest-reports/blob-${{ matrix.shard }}-of-${{ matrix.total }}.json
          --coverage.reporter=text-summary
          --coverage.thresholds.lines=0 --coverage.thresholds.functions=0
          --coverage.thresholds.statements=0 --coverage.thresholds.branches=0
      - name: Upload coverage blob
        uses: actions/upload-artifact@v4
        with:
          name: coverage-blob-${{ matrix.shard }}-of-${{ matrix.total }}
          path: .vitest-reports/
          include-hidden-files: true
          retention-days: 3

  # Merges every shard's blob and checks the thresholds in test/vitest/unit.config.js
  # against the whole suite. This is the assertion; it needs every shard, so a
  # failed or cancelled shard skips it and the shard job carries the finding.
  coverage-merge:
    runs-on: ubuntu-24.04
    needs: [coverage-shard]
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm (corepack)
        run: corepack enable
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download coverage blobs
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-blob-*
          path: .vitest-reports
          merge-multiple: true
      - name: Unit coverage vs thresholds
        run: pnpm test:unit:coverage --merge-reports

  # The required check named `coverage`. It runs whatever the legs did, because
  # a job skipped behind a failed need reports as passing to branch protection,
  # and fails unless every shard and the merge succeeded. It states no finding
  # of its own, so the verdict job leaves it out.
  coverage:
    runs-on: ubuntu-24.04
    needs: [coverage-shard, coverage-merge]
    if: ${{ always() }}
    steps:
      - name: Every coverage leg passed
        env:
          SHARDS: ${{ needs.coverage-shard.result }}
          MERGE: ${{ needs.coverage-merge.result }}
        run: |
          echo "coverage shards concluded: $SHARDS; merge concluded: $MERGE"
          [ "$SHARDS" = success ] && [ "$MERGE" = success ] || { echo "::error::a coverage leg did not succeed; the shard and merge jobs name the failing step"; exit 1; }

  # Browser-driven E2E against the web shell (Playwright).
  #
  # This job is the whole point of the suite. It previously existed but nothing
  # ran it, and it died quietly: onboarding grew three screens (license gate,
  # recovery-phrase verification, ADS consent) and every one of the 15 specs
  # broke at the first click. A test suite nobody runs is not a safety net, it
  # is a claim of one. It cannot live in `pnpm run ci` -- it needs a browser and
  # a dev server, which the unit gate must not depend on -- so it gets its own
  # job here, and now every push proves it.
  #
  # SHARDED FOR WALL TIME. On one worker the suite took 87 minutes, the longest
  # job in the run, so it runs as Playwright `--shard` legs, each with its own
  # dev server and browser. Playwright splits by spec file, so the legs are
  # balanced by test count, not by duration. The required check `e2e` is the
  # aggregator job below.
  e2e-shard:
    name: e2e shard ${{ matrix.shard }}/${{ matrix.total }}
    runs-on: ubuntu-24.04
    strategy:
      # Every shard runs to its own verdict, so one red spec does not cancel
      # the rest of the suite and hide whether anything else broke.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
        total: [6]
    env:
      # global-setup.ci.js runs the boundary, chaos and a11y vitest tiers
      # before the specs. Shard 1 alone runs them; the variable is the switch
      # tools/ci-full.sh already uses to say those tiers ran elsewhere. Without
      # it a red tier would fail every shard before any spec ran.
      XCHAIN_CI_FULL_VITEST_TIERS: ${{ matrix.shard == 1 && '0' || '1' }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm (corepack)
        run: corepack enable
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Browser binaries are not in the pnpm store; fetch them explicitly.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      # The config spawns the Vite dev server itself (webServer), so there is
      # nothing to start here. CI=1 makes it refuse to reuse a stray server.
      - name: Run E2E suite
        run: pnpm test:e2e --shard=${{ matrix.shard }}/${{ matrix.total }}
      # Artifact names are unique per run in upload-artifact v4, so each shard
      # uploads its own report under its shard number.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}-of-${{ matrix.total }}
          path: test/e2e/playwright-report/
          retention-days: 7

  # The required check named `e2e`. It runs whatever the shards did, because a
  # job skipped behind a failed need reports as passing to branch protection,
  # and fails unless every shard succeeded (a failed or cancelled shard fails
  # it). It states no finding of its own, so the verdict job leaves it out and
  # names the failing shard instead.
  e2e:
    runs-on: ubuntu-24.04
    needs: [e2e-shard]
    if: ${{ always() }}
    steps:
      - name: Every e2e shard passed
        env:
          SHARDS: ${{ needs.e2e-shard.result }}
        run: |
          echo "e2e shards concluded: $SHARDS"
          [ "$SHARDS" = success ] || { echo "::error::an e2e shard concluded $SHARDS; the shard jobs name the failing step"; exit 1; }

  # The regtest specs sign and broadcast against a live chain, so the default
  # e2e job above excludes every *.regtest.spec.js. This job runs them against
  # the PRODUCTION build (`pnpm test:e2e:regtest`), which the dev-server e2e job
  # cannot do: the dev server serves the dev-mock SDK, so only a built bundle
  # notices a failure to load the real SDK.
  #
  # Discovery always runs: it proves the regtest config loads and still finds its
  # specs. The venue run needs XC_REGTEST_SSH_HOST (repository variable) and
  # XC_REGTEST_SSH_KEY (secret), reached through an SSH tunnel because the venue
  # is not on GitHub's network. Without both, the job says in its summary that
  # the venue suite did NOT run, so a skipped gate is never read as a pass.
  e2e-regtest:
    name: e2e-regtest (rolling shard)
    runs-on: ubuntu-24.04
    # One run at a time on the shared regtest venue. Each run covers one rolling
    # quarter of the suite, keeping the venue out of the main CI critical path.
    timeout-minutes: 240
    env:
      XC_REGTEST_SSH_HOST: ${{ vars.XC_REGTEST_SSH_HOST }}
      # Which regtest chain the suite drives (RBTC, RLTC or RDOGE). Bitcoin is the
      # only live regtest chain on the CI venue; the repo variable XC_REGTEST_COIN
      # moves a run to another chain without a commit.
      XC_REGTEST_COIN: ${{ vars.XC_REGTEST_COIN || 'RBTC' }}
      XC_REGTEST_SSH_KEY: ${{ secrets.XC_REGTEST_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm (corepack)
        run: corepack enable
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: List regtest specs
        run: |
          pnpm exec playwright test --config test/e2e/playwright.regtest.config.js --list | tee regtest-list.txt
          grep -q 'regtest.spec' regtest-list.txt
      - name: Select rolling shard
        id: shard
        run: |
          currentMinutes=$(($(date -u +%s) / 60))
          shardNumber=$((currentMinutes % 4 + 1))
          echo "value=${shardNumber}/4" >> "$GITHUB_OUTPUT"
          echo "Running regtest shard ${shardNumber}/4"
      - name: Check regtest venue access
        id: venue
        run: |
          if [ -n "$XC_REGTEST_SSH_HOST" ] && [ -n "$XC_REGTEST_SSH_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::regtest e2e venue run NOT RUN: XC_REGTEST_SSH_HOST variable or XC_REGTEST_SSH_KEY secret is not set"
            echo "### regtest e2e venue run NOT RUN" >> "$GITHUB_STEP_SUMMARY"
            echo "The regtest venue is not configured for this repository, so the production-build regtest suite did not execute." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Open the regtest tunnel
        if: steps.venue.outputs.configured == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$XC_REGTEST_SSH_KEY" > ~/.ssh/regtest_key
          chmod 600 ~/.ssh/regtest_key
          # The regtest fixtures run their own `ssh <host> docker exec ...` calls without -i,
          # so name the key in the ssh config for every host this job reaches.
          printf 'Host *\n  IdentityFile ~/.ssh/regtest_key\n  IdentitiesOnly yes\n' >> ~/.ssh/config
          chmod 600 ~/.ssh/config

          # The venue's forced command holds the shared venue lock for as long as
          # this session's stdin stays open, and prints venue-lock-acquired once it
          # has it, so every runner waits on one lock. Its -L ports bind on this
          # runner, so the tunnel alone could never tell whether the venue is busy.
          gateState="$RUNNER_TEMP/venue-gate-state"
          sleep 14400 | ssh -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 -i ~/.ssh/regtest_key "$XC_REGTEST_SSH_HOST" \
            venue-lock > "$gateState" 2>&1 &
          gatePid=$!
          until grep -qx venue-lock-acquired "$gateState"; do
            if ! kill -0 "$gatePid" 2>/dev/null; then
              gateStatus=0
              wait "$gatePid" || gateStatus=$?
              # ssh itself exits 255 (unreachable host, refused key), which is a
              # broken venue and fails the job. Any other exit is the venue gate
              # giving up its two-hour lock wait while other runs held the venue:
              # that is contention, not a defect in this commit, so it reports
              # NOT RUN the way an unconfigured venue does.
              if [ "$gateStatus" = 255 ]; then
                echo "::error::The regtest venue could not be reached: $(cat "$gateState")"
                exit 1
              fi
              echo "::warning::regtest e2e venue run NOT RUN: the venue lock stayed busy for the gate wait (exit $gateStatus)"
              echo "### regtest e2e venue run NOT RUN" >> "$GITHUB_STEP_SUMMARY"
              echo "Other runs held the shared regtest venue for the whole lock wait, so this rolling shard did not execute." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done

          # Opened only once the venue is ours: a tunnel opened before a long wait
          # for the lock went idle and was gone by the time the suite started.
          attempt=1
          while ! ssh -N -f -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 -o ExitOnForwardFailure=yes -i ~/.ssh/regtest_key \
            -L 18080:localhost:18080 -L 10000:localhost:10000 \
            -L 3023:localhost:3023 -L 3025:localhost:3025 \
            -L 3223:localhost:3223 -L 3225:localhost:3225 \
            -L 3123:localhost:3123 -L 3125:localhost:3125 "$XC_REGTEST_SSH_HOST"; do
            if [ "$attempt" -ge 10 ]; then
              echo "::error::The regtest tunnel did not open after 10 attempts"
              exit 1
            fi
            echo "The regtest tunnel did not open; retrying in 30 seconds (attempt $attempt/10)"
            attempt=$((attempt + 1))
            sleep 30
          done
          flock --exclusive "$RUNNER_TEMP/xchain-wallet-regtest.lock" \
            pnpm test:e2e:regtest --shard=${{ steps.shard.outputs.value }}
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Upload Playwright report
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-regtest
          path: |
            test/e2e/playwright-report/
            test/e2e/test-results-regtest/
          retention-days: 7

  # Vulnerabilities in code that actually SHIPS. Deliberately --prod: the dev
  # toolchain's advisories (vitest's UI server, vite's dev-server path handling)
  # never reach a user, and blocking every push on them trains people to ignore the
  # gate. Production deps currently carry no high/critical advisory.
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm (corepack)
        run: corepack enable
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  # Says what this run actually FOUND, which the run's colour does not.
  #
  # A run's conclusion aggregates its jobs, so one job that never reached a
  # runner paints the whole run `failure` in the same shade a broken test does.
  # Measured twice: run 31122248576 was red because `build` and `test` were
  # cancelled while still queued (empty steps arrays, identical 15m02s
  # durations); run 31267045090 was red because every job was refused a runner
  # over an account spending limit, the finding living only in a check-run
  # annotation. Neither red named a single failing assertion, and a red that
  # names nothing trains everyone to assume the next one is spurious too.
  #
  # So this job reads the run's own jobs and classifies each one from its STEPS
  # rather than its colour: a step that concluded `failure` is a stated
  # assertion, and a job with no steps at all is reported as cancelled or
  # not-started, never as a failure. It writes the classification to the run
  # summary, which is where someone asking "is master red?" actually looks.
  #
  # Read it as: `verdict` red means a real finding, named. `verdict` green on a
  # red run means the red is infrastructure and the run wants re-running, not
  # debugging. `verdict` missing means it could not start either, which is
  # itself the account-level answer. A job that hit its time limit is red,
  # named by the step that hung.
  verdict:
    runs-on: ubuntu-24.04
    needs: [test-shard, test, drift-guards, build, coverage-shard, coverage-merge, coverage, e2e-shard, e2e, e2e-regtest, audit]
    # Runs whatever the others did. Gating it on success would silence it in
    # exactly the case it exists for.
    if: ${{ always() }}
    permissions:
      # Listing any permission drops the rest, so `actions: read` (list a run's
      # jobs) and `checks: read` (the annotation naming a billing refusal) are
      # both spelled out. `contents: read` is the checkout.
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # No pnpm install: the classifier is plain Node with no dependencies, so
      # this job stays readable even when the dependency install is what broke.
      - name: Classify this run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        # Aggregate exclusions are defined by CI_AGGREGATE_JOBS in run-verdict.mjs.
        run: node tools/release/run-verdict.mjs --run ${{ github.run_id }} --exclude verdict
