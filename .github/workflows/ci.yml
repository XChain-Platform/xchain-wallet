name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  install:
    name: Install & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Future steps (enable as packages define them):
      # - name: Typecheck
      #   run: pnpm -r --if-present typecheck
      # - name: Lint
      #   run: pnpm -r --if-present lint
      # - name: Test
      #   run: pnpm -r --if-present test
      # - name: Build
      #   run: pnpm -r --if-present build

  audit:
    name: pnpm audit (prod)
    runs-on: ubuntu-latest
    # Independent of install — runs in parallel so a failing audit
    # doesn't block the install/typecheck job from reporting.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # §9.8 — production-dep audit only. Dev-tooling advisories are
      # triaged separately and don't gate releases. --audit-level=high
      # fails on high + critical; moderate surfaces in logs without
      # failing, tracked in docs/DEPENDENCIES.md review cadence.
      - name: Run pnpm audit
        run: pnpm audit --prod --audit-level=high
