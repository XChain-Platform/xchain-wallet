name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  install:
    name: Install & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r --if-present build

      - name: Vitest + Node-script smokes
        # `test` runs Vitest in packages/core. `test:smoke` (Node-
        # script harness) runs the integration smokes. Both must
        # pass for the install job to go green.
        run: |
          pnpm -r --if-present test
          pnpm -C packages/core test:smoke

      # Future steps (enable as packages define them):
      # - name: Typecheck
      #   run: pnpm -r --if-present typecheck
      # - name: Lint
      #   run: pnpm -r --if-present lint

  e2e:
    name: Playwright (web SPA)
    runs-on: ubuntu-latest
    # Depends on the install job so Playwright picks up a cached pnpm
    # store when possible. Still does its own install because CI caches
    # don't pass node_modules between jobs.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @xchain-wallet/e2e install:browsers

      - name: Run Playwright suite
        env:
          CI: '1'
        run: pnpm --filter @xchain-wallet/e2e test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  audit:
    name: pnpm audit (prod)
    runs-on: ubuntu-latest
    # Independent of install — runs in parallel so a failing audit
    # doesn't block the install/typecheck job from reporting.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # §9.8 — production-dep audit only. Dev-tooling advisories are
      # triaged separately and don't gate releases. --audit-level=high
      # fails on high + critical; moderate surfaces in logs without
      # failing, tracked in docs/DEPENDENCIES.md review cadence.
      - name: Run pnpm audit
        run: pnpm audit --prod --audit-level=high
