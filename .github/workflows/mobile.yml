# Android build health for the Capacitor shell ( §7).
#
# THIS WORKFLOW SHIPS NOTHING. It proves the native project still builds and
# that the version numbers still derive from the tag; every artifact it uploads
# is unsigned and named to say so. Release artifacts are built AND signed in the
# maintainer ceremony on the release machine (§6 step 2), and no signing secret
# rides a runner in v1 - not even K9. The reason is worth keeping in front of
# whoever tries to "finish" this workflow later: without reproducible builds
# (D5), an artifact built on a runner cannot be verified by the person signing
# it, so putting the key here would let a runner compromise put OUR signature on
# ITS bytes. Keys off the runner while the runner still builds the shipped bytes
# protects the keys and not the users. When D5 lands, builds come back here
# behind a verify-then-sign ceremony.
#
# Scope of the triggers: tags gate every release, and PRs only when they touch
# this package. Android is the slowest lane in the repo (SDK download, Gradle,
# bundletool), and making every core-only PR pay for it buys nothing that the
# tag-time run does not already catch.
#
# workflow_dispatch is the third trigger and it is not a convenience. With only
# the two above, this lane's first successful run would have to be the release
# tag itself - and a tag is the one irreversible step here, because Play accepts
# a versionCode exactly once and a replaced upload costs a new tag (§7). This
# workflow had by then failed all three of its runs and its fix was unproven, so
# the plan was to discover whether the fix worked at the single moment where
# being wrong is most expensive. Dispatch makes the lane provable on any branch,
# beforehand, for free.
name: Mobile

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'packages/mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned by version AND by hash: bundletool is fetched from a GitHub release,
  # which is a mutable-by-the-owner URL, and it is the tool that produces the
  # APK users install. Bump both lines together or the run fails closed.
  BUNDLETOOL_VERSION: '1.18.3'
  BUNDLETOOL_SHA256: 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm must be on PATH BEFORE setup-node, or its `cache: pnpm` step
      # cannot resolve the store (same ordering as ci.yml).
      - name: Enable pnpm (corepack)
        run: corepack enable
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # AGP 8.13 / Gradle 8.14 want a modern JDK; 21 is the LTS both support.
      - name: Use JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds the web SPA and then stages it into the Capacitor webDir. The
      # `...` suffix pulls in this package's workspace dependencies, so web (and
      # core beneath it) build first and in order.
      #
      # NODE_OPTIONS is not optional here, and this workflow proved it the
      # hard way: it has run three times (all three v0.334.0 tag pushes,
      # 2026-08-02) and failed all three in THIS step with
      # `FATAL ERROR: Ineffective mark-compacts near heap limit - JavaScript
      # heap out of memory`, aborting at ~2.0 GB. Node sizes its default
      # old-space from the machine it starts on, so the release Mac builds
      # this happily and a GitHub-hosted runner does not.
      #
      # release.yml hit the identical wall on 2026-08-01 and was fixed the
      # same day (d3f8a4ec); the fix was never carried across to this file,
      # so the Android lane kept dying at the same line for another day. The
      # consequence is larger than one red run: because this step is upstream
      # of `bundleRelease`, NO Gradle build has ever run in CI, which means
      # every artifact-level gate BELOW - the exported-component count against
      # the merged manifest, the backup/cleartext posture, the boot-check
      # ordering, the webdir stamp, the versionCode assertion - has never
      # executed anywhere except by hand on the release machine. They were
      # written to catch what packaging does, and packaging has not happened
      # here.
      - name: Build the web SPA and stage it into the shell
        env:
          # Empty on a PR, which makes the build number itself from
          # package.json. On a tag this is the tag, and the assertion below
          # proves the AAB carries exactly the number that tag derives.
          XCHAIN_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm --filter "@xchain-wallet/mobile..." build

      - name: Sync the native project
        run: pnpm --filter @xchain-wallet/mobile exec cap sync android

      # Unsigned on purpose: no signingConfig exists in this project, so Gradle
      # emits an unsigned bundle and that is the whole intent.
      - name: Build the unsigned AAB
        working-directory: packages/mobile/android
        run: ./gradlew --no-daemon bundleRelease

      - name: Fetch bundletool (pinned + hash-checked)
        run: |
          set -euo pipefail
          curl -fsSL -o bundletool.jar \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          echo "${BUNDLETOOL_SHA256}  bundletool.jar" | sha256sum -c -

      # The universal APK is DERIVED from the AAB rather than built separately
      # (§6 step 2), so the direct-download lane and the Play lane cannot ship
      # different code. bundletool signs the output with its own debug key when
      # no keystore is given; that is fine here and is another reason nothing
      # this workflow emits may be published.
      - name: Derive the universal APK from that AAB
        run: |
          set -euo pipefail
          java -jar bundletool.jar build-apks \
            --bundle=packages/mobile/android/app/build/outputs/bundle/release/app-release.aab \
            --output=universal.apks \
            --mode=universal
          unzip -p universal.apks universal.apk > xchain-wallet-UNSIGNED-ci.apk
          ls -l xchain-wallet-UNSIGNED-ci.apk

      # Every manifest fact this lane pins, checked in ONE place that the
      # RELEASE CEREMONY also calls.
      #
      # These assertions used to live here as five inline steps, and this job
      # builds a bundle that is thrown away - the header of this file says so,
      # and so does tools/release/android-ceremony.sh: "CI builds the same two
      # artifacts unsigned as a health check; nothing it produces is ever
      # published." The bundle Google receives is built by the ceremony, which
      # verified its SIGNATURES and nothing at all about what the manifest
      # inside said. So the entire artifact-gate suite was aimed at the one
      # bundle nobody ships.
      #
      # Sharing the script rather than copying the steps is the point: two
      # copies of a rule is how this lane has been bitten five times, each time
      # by a mechanism scoped narrower than the rule it enforced. The script is
      # falsified against broken bundles by
      # test/smoke/audits/android-manifest-verify.smoke.js, which runs without a
      # build and so goes red long before a release does.
      - name: The built bundle's manifest is the one §5 and §7 pin
        run: |
          set -euo pipefail
          tag="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}"
          if [ -z "$tag" ]; then
            tag="v$(node -p "require('./packages/mobile/package.json').version")"
          fi
          expected="$(node packages/mobile/scripts/version.js "$tag" | cut -d' ' -f1)"
          echo "tag=$tag expects versionCode $expected"
          java -jar bundletool.jar dump manifest \
            --bundle=packages/mobile/android/app/build/outputs/bundle/release/app-release.aab \
            > merged-manifest.xml
          node tools/release/verify-android-manifest.mjs merged-manifest.xml \
            --version-code "$expected"

      # The capability floor that refuses an engine too old to PARSE the app
      # (public/boot-check.js) is only worth anything if it shipped, as a
      # CLASSIC script, AHEAD of the module bundle. The unit test asserts the
      # source index.html; what ships is the built one, which Vite rewrites
      # (it hoists the module entry and adds SRI). Same lesson as the merged
      # manifest above: assert the artifact, not the source.
      #
      # Found by running the app on API 26, where the stock WebView is
      # Chromium 58: it does not error on `type="module"`, it IGNORES it, so
      # the whole bundle silently never ran and the wallet was a blank white
      # screen. Anything that reorders these two tags, or gives this one a
      # `type`, brings that back with no other symptom.
      - name: The pre-bundle capability floor shipped, ahead of the bundle
        run: |
          set -euo pipefail
          rm -rf aab-assets
          unzip -o -q packages/mobile/android/app/build/outputs/bundle/release/app-release.aab \
            'base/assets/public/index.html' 'base/assets/public/boot-check.js' -d aab-assets
          html="aab-assets/base/assets/public/index.html"
          boot="aab-assets/base/assets/public/boot-check.js"

          test -s "$boot"
          grep -q 'noModule' "$boot"   # it is the real floor, not an empty file

          tag="$(grep -oE '<script[^>]*boot-check\.js[^>]*>' "$html")"
          echo "shipped tag: $tag"
          echo "$tag" | grep -q 'integrity="sha384-'
          # A `type` here would defer it behind the very bundle it precedes.
          if echo "$tag" | grep -q 'type='; then
            echo "boot-check.js must ship as a classic script" >&2; exit 1
          fi

          # Anchor on the TAGS. Matching the bare filename finds the HTML
          # comment above it instead, which sits before the module either way
          # and made this assertion pass a deliberately reordered file.
          b="$(grep -bo '<script[^>]*boot-check\.js' "$html" | head -1 | cut -d: -f1)"
          m="$(grep -bo '<script[^>]*type="module"' "$html" | head -1 | cut -d: -f1)"
          echo "boot-check tag at $b, module entry at $m"
          test "$b" -lt "$m"

      # The bundle inside the artifact is the bundle that was staged.
      #
      # Gradle already refuses at configuration time when assets/public does
      # not match packages/mobile/www (app/build.gradle), which covers the
      # hand-driven `./gradlew` this exists for. This is the same claim checked
      # one layer further out, against the bytes that would be signed: the
      # stamp rides inside the AAB, so it is verifiable by anyone holding the
      # artifact, without trusting the machine that built it.
      #
      # Same lesson as the merged manifest and the boot-check ordering above:
      # a source-level assertion cannot see what packaging did.
      - name: The staged web bundle is the one inside the bundle
        run: |
          set -euo pipefail
          rm -rf aab-stamp
          unzip -o -q packages/mobile/android/app/build/outputs/bundle/release/app-release.aab \
            'base/assets/public/webdir-stamp.txt' -d aab-stamp
          shipped="$(cat aab-stamp/base/assets/public/webdir-stamp.txt)"
          staged="$(cat packages/mobile/www/webdir-stamp.txt)"
          echo "shipped: $shipped"
          echo "staged:  $staged"
          test -n "$shipped"
          test "$shipped" = "$staged"

      - name: Upload the unsigned smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          # Named UNSIGNED, and retained briefly, so nobody mistakes a runner
          # artifact for a release. The release lane publishes from the ceremony,
          # never from here.
          name: android-UNSIGNED-smoke-${{ github.sha }}
          path: |
            packages/mobile/android/app/build/outputs/bundle/release/app-release.aab
            xchain-wallet-UNSIGNED-ci.apk
          retention-days: 7
