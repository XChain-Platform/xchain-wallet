    The Trezor Connect bridge document (§40.12). main/trezorBridgeWindow.js
    loads it from the package into a window on the isolated no-HID session.
    It runs the hosted Trezor Connect global build and responder.js, which
    answers main's relayed Connect requests through the bridge preload.

    CSP: no source beyond this directory's own script and the Trezor
    Connect origin, and no inline script.
-->
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://connect.trezor.io; connect-src https://connect.trezor.io; frame-src https://connect.trezor.io; style-src 'unsafe-inline'" />
        <title>Trezor Connect</title>
        <script src="https://connect.trezor.io/9/trezor-connect.js"></script>
    </head>
    <body>
        <script src="responder.js"></script>
    </body>
</html>
