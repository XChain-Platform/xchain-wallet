<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!--
            CSP notes (§40.12):
            - `script-src 'self' https://connect.trezor.io` - Trezor
              Connect is loaded at runtime from Trezor's hosted global
              build instead of bundling the T-RSL-licensed
              `@trezor/connect-web` npm package (see
              renderer/signerFactories/trezorFactory.js). The hosted
              script runs in the renderer's own context, so it must be
              in script-src. This is a deliberate posture change from the
              previous iframe-only allowance; it is what keeps zero
              `@trezor/*` code in the packaged app.
            - `frame-src https://connect.trezor.io` - Trezor Connect also
              opens its signing UI in a cross-origin iframe/popup from
              this domain. Allow-listing it explicitly keeps the trust
              assumption auditable. See REPRODUCIBLE_BUILDS.md §
              "Trezor Connect trust boundary".
            - `connect-src` stays 'self' - the wallet's own code never
              fetches from connect.trezor.io; the hosted script and its
              iframe do, bound by script-src/frame-src above.
        -->
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://connect.trezor.io; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-src https://connect.trezor.io;" />
        <title>XChain Wallet</title>
    </head>
    <body>
        <div id="xchain-desktop-root"></div>
        <script type="module" src="./main.jsx"></script>
    </body>
</html>
