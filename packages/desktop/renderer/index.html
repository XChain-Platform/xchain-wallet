<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!--
            CSP notes (§40.12):
            - `script-src 'self'` - this window, the one holding the
              preload bridges and the WebHID grant, runs no remote
              script. Trezor Connect's hosted global build (no bundled
              Trezor npm package; tools/build-reproduce/check-no-trezor-dist.sh
              enforces that at build time) loads only inside the bridge
              window main/trezorBridgeWindow.js builds: a packaged
              local document with its own tight CSP, on a dedicated
              session wired to attachHidDenial. The two talk only through
              main's narrow relay, never directly.
            - `frame-src 'none'` - the packaged renderer embeds no iframe,
              the same premise main/permissions.js's subframe guard
              latches on. Declared rather than omitted, since an omitted
              directive falls back to default-src 'self'.
            - `connect-src` stays 'self' - the wallet's own code never
              fetches from connect.trezor.io.
        -->
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-src 'none';" />
        <meta name="theme-color" content="#FFFFFF" />
        <script src="./theme-init.js"></script>
        <style>
            html, body { background: #FFFFFF; }
            @media (prefers-color-scheme: dark) {
                html:not([data-xc-theme="light"]),
                html:not([data-xc-theme="light"]) body { background: #0B0F17; }
            }
            html[data-xc-theme="dark"], html[data-xc-theme="dark"] body { background: #0B0F17; }
            html[data-xc-theme="light"], html[data-xc-theme="light"] body { background: #FFFFFF; }
        </style>
        <title>XChain Wallet</title>
    </head>
    <body>
        <div id="xchain-desktop-root"></div>
        <script type="module" src="./main.jsx"></script>
    </body>
</html>
