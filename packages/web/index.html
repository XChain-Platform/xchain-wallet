<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <!--
          `viewport-fit=cover` is what makes `env(safe-area-inset-*)` return
          real numbers. Without it those values are ZERO on every device, which
          is why the two existing `env(safe-area-inset-bottom)` rules in
          BottomTabBar and LeftNav had never actually inset anything, and why
          the iPhone shell drew its logo underneath the Dynamic Island. The
          insets are applied in `core/ui/tokens.css`; this line only makes them
          exist. No effect on desktop browsers, where every inset is 0.
        -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#0B0F17" media="(prefers-color-scheme: dark)" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <link rel="preload" href="../core/src/ui/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin />
        <script src="/theme-init.js"></script>
        <style>
            html, body { background: #FFFFFF; }
            @media (prefers-color-scheme: dark) {
                html:not([data-xc-theme="light"]),
                html:not([data-xc-theme="light"]) body { background: #0B0F17; }
            }
            html[data-xc-theme="dark"], html[data-xc-theme="dark"] body { background: #0B0F17; }
            html[data-xc-theme="light"], html[data-xc-theme="light"] body { background: #FFFFFF; }
        </style>
        <style>
            /* Boot screen: the fading logo. Same look as the
               React Loading screen (core Loading.module.css); keep them in step. */
            .xc-boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
            .xc-boot img { display: block; width: 152px; height: auto; animation: xc-boot-fade 0.8s ease-out both; }
            @keyframes xc-boot-fade { from { opacity: 0.1; } to { opacity: 1; } }
            @media (prefers-reduced-motion: reduce) { .xc-boot img { animation: none; } }
            .xc-boot .xc-boot-bar { position: relative; overflow: hidden; inline-size: 152px; block-size: 4px; margin-block-start: 16px; border-radius: 4px; background: rgba(128, 128, 128, 0.3); }
            .xc-boot .xc-boot-bar > span { position: absolute; inset-block: 0; inset-inline-start: 0; inline-size: 40%; border-radius: 4px; background: #0089D0; animation: xc-boot-slide 1.2s ease-in-out infinite; }
            @keyframes xc-boot-slide { from { inset-inline-start: -40%; } to { inset-inline-start: 100%; } }
            @media (prefers-reduced-motion: reduce) { .xc-boot .xc-boot-bar > span { animation: none; inline-size: 100%; } }
        </style>
        <link rel="manifest" href="/manifest.webmanifest" />
        <link rel="icon" type="image/png" href="/favicon.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
        <title>XChain Wallet</title>
        <!--
          The pre-bundle capability floor (§3). Classic ES5 script, in
          <head>, ahead of the module below: an engine that cannot parse (or
          does not understand) the module bundle never runs a line of it, so
          the floor inside it cannot report anything and the user gets a blank
          screen. See public/boot-check.js for the full reasoning. It must
          stay ahead of the bundle and must not gain `type="module"`.
        -->
        <script src="/boot-check.js"></script>
    </head>
