<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <!--
          `viewport-fit=cover` is what makes `env(safe-area-inset-*)` return
          real numbers. Without it those values are ZERO on every device, which
          is why the two existing `env(safe-area-inset-bottom)` rules in
          BottomTabBar and LeftNav had never actually inset anything, and why
          the iPhone shell drew its logo underneath the Dynamic Island. The
          insets are applied in `core/ui/tokens.css`; this line only makes them
          exist. No effect on desktop browsers, where every inset is 0.
        -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <link rel="icon" type="image/png" href="/favicon.png" />
        <title>XChain Wallet</title>
        <!--
          The pre-bundle capability floor (§3). Classic ES5 script, in
          <head>, ahead of the module below: an engine that cannot parse (or
          does not understand) the module bundle never runs a line of it, so
          the floor inside it cannot report anything and the user gets a blank
          screen. See public/boot-check.js for the full reasoning. It must
          stay ahead of the bundle and must not gain `type="module"`.
        -->
        <script src="/boot-check.js"></script>
    </head>
    <body>
        <div id="xchain-web-root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
