ext {
    // D2 (§10, decided 2026-07-31): API 26 / Android 8, above
    // Capacitor's own floor of 24. Chosen for where the System WebView is
    // realistically still updated: the wallet's crypto path is WebCrypto in
    // that WebView, and a device stuck on an ancient one is a device the
    // wallet should decline rather than half-serve (§3 runtime floor check).
    minSdkVersion = 26
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    // Pinned like every other androidx line here (S2). 1.1.0 is the
    // last stable release; the 1.2.0-alpha line carries the API changes for
    // Android 15's identity-check work and is not something a wallet's unlock
    // path should ride while it is still alpha.
    androidxBiometricVersion = '1.1.0'
    // Argon2id for the native key derivation. Exact pin, and its checksums
    // sit in gradle/verification-metadata.xml, so a bump is a reviewed edit.
    bouncyCastleVersion = '1.86'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
    wearKotlinVersion = '2.4.21'
    wearPlayServicesVersion = '20.0.1'
    wearComposeVersion = '1.6.2'
    wearComposeUiVersion = '1.11.4'
    wearCoreVersion = '1.4.0'
    wearRemoteInteractionsVersion = '1.2.0'
    wearActivityComposeVersion = '1.13.0'
    wearTilesVersion = '1.6.2'
    wearProtoLayoutVersion = '1.4.2'
    wearWatchfaceVersion = '1.3.0'
    wearSerializationVersion = '1.13.0'
    wearCoroutinesVersion = '1.11.0'
    wearRobolectricVersion = '4.18.1'
    wearTestRunnerVersion = '1.7.0'
}
