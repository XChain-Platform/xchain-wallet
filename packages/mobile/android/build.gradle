// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        // The google-services classpath the Capacitor template ships is gone
        // with the block that used it in app/build.gradle: FCM is a non-goal
        // (§1), and an unused plugin is still a build-time dependency we would
        // be pinning, fetching and trusting for nothing.

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
