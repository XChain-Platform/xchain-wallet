packages:
  - 'packages/*'
  - 'test/e2e'

# .npmrc IS NO LONGER READ FOR THESE, and finding that out cost six test
# files (2026-08-06, the pnpm 9 -> 11 raise). pnpm 11 takes its settings
# from this file, so `.npmrc`'s `shamefully-hoist`, `supportedArchitectures`
# and `strict-ssl` were all silently dropped: nothing warned, and the only
# symptom was root-level tests failing to resolve `@scure/*` because the
# packages sat in pnpm's private hoist directory instead of at the root.
#
# `.npmrc` keeps its copies for the same reason the package.json `pnpm`
# block below keeps its: whichever the pinned pnpm reads is the live one,
# and a settings home that goes unread must not read as "unset".
#
# supportedArchitectures is the one with teeth beyond convenience. It
# decides which platform binaries are fetched, so losing it changes what a
# two-arch build has available to package, and this lane's reproducibility
# work rides on the toolchain being the same one twice.
#
# AND IT DOES NOT MEAN THE SAME THING HERE AS IT DID IN .npmrc. Under pnpm 9
# the list was ADDITIVE: the current platform was always installed and these
# were extras. pnpm 11 REPLACES - list only arm64 and an amd64 host installs
# no x64 binaries at all. Measured on 2026-08-06 inside the amd64 reproduce
# container, three installs on one image: with the .npmrc list transcribed
# verbatim (cpu: arm64) `@rollup/rollup-linux-x64-gnu` and
# `@esbuild/linux-x64` were ABSENT and the reproduce build died in `vite
# build`; with the block deleted the x64 pair appeared and the arm64 pair
# vanished; with every target listed, as below, both are present.
#
# So this list is now exhaustive rather than supplementary: every OS and CPU
# any lane builds on has to appear, including win32, because the Windows
# release lane runs on a windows-latest runner and would otherwise install
# nothing native at all.
shamefullyHoist: true
strictSsl: true
supportedArchitectures:
  os:
    - darwin
    - linux
    - win32
  cpu:
    - arm64
    - x64

# WHY THIS FILE DUPLICATES package.json's `pnpm` BLOCK.
#
# pnpm moved these settings between two homes. pnpm 9 (the version pinned
# in `packageManager`) reads `pnpm.*` from the root package.json and
# IGNORES the blocks below. pnpm 10 does the reverse: it reads these and
# warns that "the pnpm field in package.json is no longer read".
#
# Neither errors on the one it ignores. So while the two disagree, the
# effective configuration flips silently the day anyone bumps pnpm. That
# is not hypothetical: pnpm-lock.yaml's own `overrides:` block records
# package.json's values verbatim, which is how it was proven that the
# package.json copy is the live one today.
#
# Both copies must therefore stay IDENTICAL, and
# test/smoke/audits/pnpm-config-parity.smoke.js fails the build if they
# drift. Change one, change the other, in the same commit.

# Security pins on transitive dependencies. Kept at `^` rather than `>=`:
# an uncapped `>=4.0.6` permits a future 5.x major to be pulled in
# silently, which is the opposite of what a pin is for.
overrides:
  tar: ^7.5.7
  ws: ^8.20.1
  brace-expansion@1: ^1.1.15
  # 2.1.2 closes GHSA/CVE-2026-13149 (exponential-time expansion of
  # consecutive non-expanding {} groups, a DoS in dev tooling paths).
  brace-expansion@2: ^2.1.2
  brace-expansion@5: ^5.0.6
  vite: '>=6.4.3 <7'
  protobufjs: ^7.5.8
  form-data: ^4.0.6
  '@tootallnate/once': ^2.0.1
  axios: ^1.16.1
  # electron-updater parses the channel pointer it fetches from the feed with
  # js-yaml, so GHSA-52cp-r559-cp3m (quadratic CPU on merge-key chains) is
  # reachable from a file the update path downloads. Major-scoped because the
  # tree also holds a 3.x line that this pin must not drag forward.
  js-yaml@4: ^4.3.1
  # fast-uri >=3.0.0 <3.1.5 treats a backslash as a path separator where the
  # WHATWG URL parser does not, so two parsers disagree about the HOST of the
  # same string (GHSA-7p8r-x3mc-p8w7). It arrives under the SDK, transitively,
  # and this repo does not choose its version - which is exactly what an
  # override is for. Pinned in BOTH homes because pnpm 9 reads package.json and
  # pnpm 10 reads this file, neither errors on the copy it ignores, and
  # pnpm-config-parity.smoke.js fails the build if they drift.
  fast-uri: ^3.1.5
  # hono arrives under the SDK's @modelcontextprotocol/sdk dependency;
  # 4.12.33 carries CVE-2026-71848/-71849/-71850 (language-middleware DoS,
  # Connection-header passthrough in the proxy helper, memo() retaining SSR
  # output across requests). Floor at the first patched version.
  hono: ^4.12.34

# "Lifecycle scripts disabled or allowlisted". This is the
# allowlist. Anything NOT named here has its preinstall/install/postinstall
# blocked, so a newly-added or compromised transitive dependency cannot run
# arbitrary code at install time on a release runner.
#
# Every entry earns its place by needing to fetch or build a binary:
#   electron            downloads the Electron runtime
#   esbuild             downloads its platform binary (vite depends on it)
#   electron-winstaller selects a 7z build for the host arch
#   sharp               checks/builds its image bindings
#   tiny-secp256k1      builds its secp256k1 bindings
#
# Adding to this list is a supply-chain decision, not a build fix. If a
# dependency starts demanding a build script, ask why before listing it.
onlyBuiltDependencies:
  - electron
  - electron-winstaller
  - esbuild
  - sharp
  - tiny-secp256k1

# pnpm 11 replaced the list above with this map, and it does NOT merely
# rename it: until every entry says true or false, `pnpm install` exits 1
# with "Ignored build scripts", so the allowlist is not something that can
# be left to a default. pnpm 11 wrote this block itself, with
# "set this to true or false" in every value, and that is what a fresh
# clone hits.
#
# BOTH forms are kept on purpose, which is the same reasoning that kept the
# root package.json copy: whichever one the pinned pnpm reads is the live
# one, and a major bump must not silently disarm the allowlist by finding
# nothing where it looked. `onlyBuiltDependencies` above is the pnpm 9
# form; this is the pnpm 11 form. Keep them in agreement.
#
# secp256k1 is FALSE deliberately, and it is the one entry that is a
# decision rather than a transcription. pnpm 11 surfaces it because it asks
# to run a build script; it was never on the pnpm 9 allowlist, so its
# scripts have never run here and nothing needs them. Only tiny-secp256k1,
# which builds the bindings this wallet actually uses, is allowed. Flipping
# it to true is a supply-chain decision, per the note above.
#
# electron is absent because pnpm 11 does not ask about it: its postinstall
# is no longer classified as a build script needing approval. Listing a
# package pnpm never asks about is harmless but misleading, so it is left
# out rather than written for symmetry.
allowBuilds:
  electron-winstaller: true
  esbuild: true
  secp256k1: false
  sharp: true
  tiny-secp256k1: true
